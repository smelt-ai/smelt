# 打 tag（v*）→ 在 Apple Silicon runner 上打包 Smelt.dmg → 发布到 GitHub Release，
# 再附上 Linux 运行时两种架构的包和一键安装脚本。
# 本地打包链路复用：make dist-build → scripts/package-mac.sh；ci/linux/ci.sh package。
name: release

on:
  push:
    tags:
      - "v*"

# 需要写权限才能创建 Release 并上传产物
permissions:
  contents: write

jobs:
  build:
    # 必须 arm64：package-mac.sh 会用 file 校验产物是 arm64，Intel 直接拒绝。
    # macos-14 及以上默认就是 Apple Silicon。
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 打包链路依赖这些文件真的进了 git；缺任何一个就一次性列全并失败，
      # 而不是跑到一半才炸（历史教训：本地能打包 ≠ 文件都入了库）。
      - name: Verify required files exist
        run: |
          missing=0
          for f in \
            Makefile \
            scripts/package-mac.sh \
            scripts/make-dmg-bg.py \
            scripts/dmg-settings.py \
            assets/AppIcon.icns \
            Cargo.toml; do
            if [[ ! -f "$f" ]]; then
              echo "✗ 缺少打包所需文件：$f"
              missing=1
            fi
          done
          [[ "$missing" == 0 ]] || { echo "打包链路文件不完整，终止。"; exit 1; }
          echo "✅ 打包所需文件齐全"

      # tag 去掉 v 前缀，必须与 Cargo.toml 的 version 一致，避免版本号漂移。预发布的
      # tag 带 -rc.1 这类后缀（见 prerelease），比对时只看后缀前面的部分。
      - name: Check tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$tag  Cargo.toml=$crate"
          if [[ "$tag" != "$crate" ]]; then
            echo "✗ tag($tag) 与 Cargo.toml version($crate) 不一致，先改 Cargo.toml 再打 tag。"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # GPUI 等 git 依赖编译很慢，缓存 cargo registry 与 target。
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 导入稳定签名身份（scripts/setup-codesign-identity.sh 本地生成、存进
      # repo secrets 的自签名证书）：签名的 designated requirement 锚定在证书
      # 哈希而非二进制内容，用户装上新版本后 TCC（完全磁盘访问权限等）授权不会
      # 失效。没配置 secrets（比如 fork 出去的仓库）就跳过，package-mac.sh 会
      # 自动回退 ad-hoc 签名。
      - name: Import codesign identity
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          if [[ -z "$CODESIGN_P12_BASE64" ]]; then
            echo "未配置 CODESIGN_P12_BASE64，本次仍走 ad-hoc 签名"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$CODESIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KEYCHAIN" -P "$CODESIGN_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/codesign.p12"

          # codesign 非交互访问私钥必须显式放行分区列表，否则会卡在钥匙串授权弹窗
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

          # 加进搜索列表：package-mac.sh 里 codesign/find-certificate 不带
          # --keychain 参数，得让这个临时钥匙串在默认搜索路径里才能被找到。
          EXISTING="$(security list-keychains -d user | sed 's/[\" ]//g')"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

      # 一步到位：cargo build --release + 组装 .app + 打 dmg。
      # dmg 的定制窗口（背景/图标摆位）由 dmgbuild 直接写 .DS_Store 完成，不依赖
      # Finder，headless runner 上和本地打出来的完全一致——定制没生效就是 bug，
      # 别再当成 CI 的预期行为。工具链由 package-mac.sh 自建 venv 装，无需在此预装。
      - name: Build & package
        env:
          SMELT_CODESIGN_IDENTITY: "Smelt Local Signing"
        run: make dist-build

      # 产物必须真的生成，否则后面上传会是空发布。
      - name: Verify artifact
        run: |
          test -f dist/Smelt.dmg || { echo "✗ 没生成 dist/Smelt.dmg"; exit 1; }
          ls -lh dist/Smelt.dmg
          test -x dist/Smelt.app/Contents/MacOS/smelt-notify \
            || { echo "✗ App 缺少可执行的 smelt-notify"; exit 1; }
          echo "✅ 发布产物校验通过"

      - name: Clean up codesign keychain
        if: always()
        run: |
          [[ -n "${KEYCHAIN_PATH:-}" ]] && security delete-keychain "$KEYCHAIN_PATH" || true

      # tag 带 - 后缀（v0.9.0-rc.1）就发成预发布：不成为 Latest，一键安装默认装的
      # releases/latest 也不会指向它（要装它得设 SMELT_VERSION）。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Smelt.dmg
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Linux 运行时的包（设计文档 D7「一键安装」）：两种架构各在对应架构的 runner 上原生构建，
  # 不交叉编译。在 Ubuntu 22.04 容器里编，链接的 glibc 是 2.35，Debian 12+、Ubuntu 22.04+
  # 都能跑；直接在 runner 上编会链到更新的 glibc，老一点的系统上起不来。
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git

      - name: Checkout
        uses: actions/checkout@v7

      # 容器里工作区属主和当前用户不一致，git 会拒绝操作。
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Toolchain
        run: ./ci/linux/env-setup.sh

      - name: Package
        run: ./ci/linux/ci.sh package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: smeltd-linux-${{ matrix.arch }}
          path: dist/smeltd-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # 等 dmg 那边建好 Release 再往上加，避免两边同时建。附上一键安装脚本（发布名 install.sh）
  # 和校验和清单：一键安装从清单里认出各架构的包名，并对着它核对。
  linux-release:
    needs: [build, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: smeltd-linux-*
          merge-multiple: true
          path: dist

      - name: Checksums and installer
        run: |
          cd dist
          sha256sum smeltd-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          install -m 0755 ../scripts/get-smeltd.sh install.sh

      - name: Add to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/smeltd-*.tar.gz
            dist/SHA256SUMS
            dist/install.sh
          prerelease: ${{ contains(github.ref_name, '-') }}
