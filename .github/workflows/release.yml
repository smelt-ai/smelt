# 打 tag（v*）→ 在 Apple Silicon runner 上打包 Smelt.dmg → 发布到 GitHub Release，
# 再附上 Linux 运行时两种架构的包、Windows 安装程序和一键安装脚本；iOS 传到 TestFlight。
# 本地打包链路复用：make dist-build → scripts/package-mac.sh；Linux 用 scripts/package-linux.sh。
name: release

on:
  push:
    tags:
      - "v*"

# 需要写权限才能创建 Release 并上传产物
permissions:
  contents: write

jobs:
  build:
    # 必须 arm64：package-mac.sh 会用 file 校验产物是 arm64，Intel 直接拒绝。
    # macos-14 及以上默认就是 Apple Silicon。
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 发布说明要找上一个 tag，需要完整历史和全部 tag。
          fetch-depth: 0

      # 打包链路依赖这些文件真的进了 git；缺任何一个就一次性列全并失败，
      # 而不是跑到一半才炸（历史教训：本地能打包 ≠ 文件都入了库）。
      - name: Verify required files exist
        run: |
          missing=0
          for f in \
            Makefile \
            scripts/package-mac.sh \
            scripts/package-linux.sh \
            scripts/version.sh \
            scripts/build-smelt-pi.sh \
            scripts/fetch-bun.sh \
            scripts/entitlements.plist \
            scripts/jit-entitlements.plist \
            scripts/make-dmg-bg.py \
            scripts/dmg-settings.py \
            assets/AppIcon.icns \
            Cargo.toml; do
            if [[ ! -f "$f" ]]; then
              echo "✗ 缺少打包所需文件：$f"
              missing=1
            fi
          done
          [[ "$missing" == 0 ]] || { echo "打包链路文件不完整，终止。"; exit 1; }
          echo "✅ 打包所需文件齐全"

      # 版本号只在 tag 上：tag 去掉 v 就是版本号，打包时经 SMELT_BUILD_VERSION 编进程序（见
      # scripts/version.sh，取号见 docs/release.md）。桌面请远程运行时升级时，运行时按这个版本号
      # 去同名 tag 的 Release 下载包。linux、ios、windows 这几个 job 也各设一遍。
      - name: Version from tag
        run: |
          echo "SMELT_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          SMELT_BUILD_VERSION="${GITHUB_REF_NAME#v}" scripts/version.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # GPUI 等 git 依赖编译很慢，读 release-cache.yml 在 main 上预热的 release 依赖缓存。
      # 只读不存：tag 上存的缓存别处读不到，每次发版白占 1.8GB，还会把 main 的挤掉。
      # 以前没设 shared-key，键里带着 job 名，main 上没有哪个 job 存过这个键，从来没命中过。
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mac-release
          save-if: false

      # 导入稳定签名身份（scripts/setup-codesign-identity.sh 本地生成、存进
      # repo secrets 的自签名证书）：签名的 designated requirement 锚定在证书
      # 哈希而非二进制内容，用户装上新版本后 TCC（完全磁盘访问权限等）授权不会
      # 失效。没配置 secrets（比如 fork 出去的仓库）就跳过；package-mac.sh
      # 找不到证书会失败，不会改用 ad-hoc（-）。
      - name: Import codesign identity
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          if [[ -z "$CODESIGN_P12_BASE64" ]]; then
            echo "未配置 CODESIGN_P12_BASE64，打包时会因缺少签名身份失败"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$CODESIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KEYCHAIN" -P "$CODESIGN_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/codesign.p12"

          # codesign 非交互访问私钥必须显式放行分区列表，否则会卡在钥匙串授权弹窗
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

          # 加进搜索列表：package-mac.sh 里 codesign/find-certificate 不带
          # --keychain 参数，得让这个临时钥匙串在默认搜索路径里才能被找到。
          EXISTING="$(security list-keychains -d user | sed 's/[\" ]//g')"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

      # 一步到位：cargo build --release + 组装 .app + 打 dmg。
      # dmg 的定制窗口（背景/图标摆位）由 dmgbuild 直接写 .DS_Store 完成，不依赖
      # Finder，headless runner 上和本地打出来的完全一致——定制没生效就是 bug，
      # 别再当成 CI 的预期行为。工具链由 package-mac.sh 自建 venv 装，无需在此预装。
      - name: Build & package
        env:
          SMELT_CODESIGN_IDENTITY: "Smelt Local Signing"
          SMELT_UPDATE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Smelt.app.zip
        run: make dist-build

      # 桌面自更新下载的是这个 zip（见 smelt-client 的 updater）。ditto 保留签名和扩展属性。
      - name: Update archive
        run: ditto -c -k --keepParent dist/Smelt.app dist/Smelt.app.zip

      # 产物必须真的生成，否则后面上传会是空发布。
      - name: Verify artifact
        run: |
          test -f dist/Smelt.dmg || { echo "✗ 没生成 dist/Smelt.dmg"; exit 1; }
          test -f dist/Smelt.app.zip || { echo "✗ 没生成 dist/Smelt.app.zip"; exit 1; }
          ls -lh dist/Smelt.dmg
          test -x dist/Smelt.app/Contents/MacOS/smelt-notify \
            || { echo "✗ App 缺少可执行的 smelt-notify"; exit 1; }
          echo "✅ 发布产物校验通过"

      - name: Clean up codesign keychain
        if: always()
        run: |
          [[ -n "${KEYCHAIN_PATH:-}" ]] && security delete-keychain "$KEYCHAIN_PATH" || true

      # 发布说明的起点要自己算：GitHub 默认往回找上一个正式版，而 v0.6.6–v0.6.14 在改以
      # GitHub 为开发源之前的历史上、不是现在 main 的祖先，它会一路退回 v0.6.5，每个版本
      # 都把以前的 PR 再列一遍。规则：按版本号往前找第一个是本次祖先的 tag；预发布从上一个
      # tag（含 rc）算起，正式版从上一个正式版算起，正式版的说明就涵盖它之前所有 rc。
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=true
          previous=""
          seen=false
          # versionsort.suffix=- 让 v0.9.0-rc.3 排在 v0.9.0 前面。
          for tag in $(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname); do
            if [[ "$tag" == "$GITHUB_REF_NAME" ]]; then seen=true; continue; fi
            $seen || continue
            [[ "$prerelease" == false && "$tag" == *-* ]] && continue
            git merge-base --is-ancestor "$tag" "$GITHUB_REF_NAME" || continue
            previous="$tag"
            break
          done
          echo "上一个版本：${previous:-（无）}"
          args=(-f tag_name="$GITHUB_REF_NAME")
          [[ -n "$previous" ]] && args+=(-f previous_tag_name="$previous")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body \
            > "$RUNNER_TEMP/release-notes.md"
          version="${GITHUB_REF_NAME#v}"
          cat >> "$RUNNER_TEMP/release-notes.md" <<EOF

          ## Windows

          下载 \`smelt-${version}-windows-x86_64-setup.exe\` 运行即可。按用户安装，不要管理员权限，默认装到 \`%LOCALAPPDATA%\\Programs\\Smelt\`，可选把 \`smelt\` 命令加入 PATH。装好后 Smelt 会在应用内检查更新（设置 → 关于 → 更新），也可以直接运行新版本的安装程序覆盖安装，覆盖前先关掉 Smelt。没有应用内更新的旧版要再手动装一次。这一版没有代码签名。打开时 Windows SmartScreen 可能提示未知发布者，选择仍要运行即可。升级本机守护会重启进程，终端会话不保留。
          EOF
          cat "$RUNNER_TEMP/release-notes.md"

      # tag 带 - 后缀（v0.9.0-rc.1）就发成预发布：不成为 Latest，一键安装默认装的
      # releases/latest 也不会指向它（要装它得设 SMELT_VERSION）。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Smelt.dmg
            dist/Smelt.app.zip
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Linux 运行时的包（设计文档 D7「一键安装」）：两种架构各在对应架构的 runner 上原生构建，
  # 不交叉编译。在 Ubuntu 22.04 容器里编，链接的 glibc 是 2.35，Debian 12+、Ubuntu 22.04+
  # 都能跑；直接在 runner 上编会链到更新的 glibc，老一点的系统上起不来。
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    steps:
      # reqwest 在 Linux 上走 native-tls，openssl-sys 要 OpenSSL 头文件和 pkg-config。
      # 产物动态链接 libssl3：Debian 12+、Ubuntu 22.04+ 都有，curl 就依赖它。
      - name: Install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libssl-dev pkg-config unzip

      - name: Checkout
        uses: actions/checkout@v7

      # 容器里工作区属主和当前用户不一致，git 会拒绝操作。
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Version from tag
        run: echo "SMELT_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 版本由仓库根的 rust-toolchain.toml 决定，rustup 只装个壳，再按它补齐工具链。
      - name: Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - name: Package
        run: ./scripts/package-linux.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: smeltd-linux-${{ matrix.arch }}
          path: dist/smeltd-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # 等 dmg 那边建好 Release 再往上加，避免两边同时建。附上一键安装脚本（发布名 install.sh）
  # 和校验和清单：一键安装从清单里认出各架构的包名，并对着它核对。
  linux-release:
    needs: [build, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: smeltd-linux-*
          merge-multiple: true
          path: dist

      # 先只放 Linux 包的校验和，一键安装和运行时自动升级马上能用；所有产物到齐后
      # checksums job 再整份重写（两边都按文件名精确匹配，多出的行不影响它们）。
      - name: Checksums and installer
        run: |
          cd dist
          sha256sum smeltd-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          install -m 0755 ../scripts/get-smeltd.sh install.sh

      - name: Add to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/smeltd-*.tar.gz
            dist/SHA256SUMS
            dist/install.sh
          prerelease: ${{ contains(github.ref_name, '-') }}

  # 手机 App 的安装包。正式签名的 keystore 存在 secrets 里，没配就失败（发出 debug 签名的
  # 包，以后换正式签名时用户只能卸载重装）。versionCode 用这条流水线的 run_number：
  # 逐次递增，新包总能覆盖旧包；versionName 就是 tag 去掉 v（含 -rc.N）。
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本要求同 ci.yml 的 android-build。
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # 路径、shared-key 与只读的原因见 ci.yml 的 android-build：tag 上存的缓存别处读不到，
      # 只读 main 的。
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          workspaces: ". -> mobile/build/rust_lib_smelt_mobile/build/release"
          save-if: false

      # 版本钉在仓库根的 mise.toml，与本地开发同一份；只装 Flutter，CocoaPods 这里用不到。
      # 不开缓存：Flutter SDK 解压后约 4GB，会挤掉仓库 10GB 配额里的 Rust 缓存，现下载更划算。
      - name: Install Flutter
        uses: jdx/mise-action@v5
        with:
          install_args: flutter
          cache: false

      # app/build.gradle.kts 读 android/key.properties（已 gitignore）。不用 -P 直通 Gradle：
      # 参数会进构建缓存和日志，密码容易泄进 CI 输出。构建完和 keystore 一起删。
      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SMELT_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SMELT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMELT_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMELT_ANDROID_KEY_PASSWORD }}
        run: |
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "✗ 没配置 SMELT_ANDROID_${var}，发版的 APK 必须正式签名。"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          umask 077
          cat > mobile/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd mobile && flutter build apk --release --target-platform android-arm64 \
            --build-name "$version" --build-number "${{ github.run_number }}")
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
            "dist/Smelt-${version}-android-arm64.apk"
          ls -lh dist/

      # 签名必须是正式证书：apksigner 打出证书指纹，debug 证书的主题是 "CN=Android Debug"。
      - name: Verify signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs dist/Smelt-*-android-arm64.apk | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "✗ APK 是 debug 签名"
            exit 1
          fi

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" mobile/android/key.properties

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: smelt-android
          path: dist/Smelt-*-android-arm64.apk
          if-no-files-found: error

  # 同 linux-release：等 dmg 那边建好 Release 再往上加。
  android-release:
    needs: [build, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: smelt-android
          path: dist

      - name: Add to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Smelt-*-android-arm64.apk
          prerelease: ${{ contains(github.ref_name, '-') }}

  # iOS：每个 tag 都传一个构建到 App Store Connect，处理完自动发给 TestFlight 内部测试组。
  # 提交 App Store 审核仍在 App Store Connect 里手动做，不是每次发版都要发手机，见 docs/release.md 的「移动端」。
  # 不挂 Release，也不进 checksums：ipa 只能经 App Store 分发。
  ios:
    # App Store 要求用当前大版本的 iOS SDK 出包，macos-26 带 Xcode 26。
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version from tag
        run: echo "SMELT_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # cargokit 用 rust-toolchain.toml 钉的工具链编 crates/smelt-mobile，缺的 target 它自己装。
      # 不读 Rust 缓存：没有哪个 main 上的 job 编 iOS，预热不到，每次冷编。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # mise.toml 里的 Flutter、Ruby、CocoaPods 全装，iOS 要 pod install。缓存不开的原因同 android。
      - name: Install Flutter and CocoaPods
        uses: jdx/mise-action@v5
        with:
          cache: false

      # 签名分两段，都是自动签名：
      # - 导出时用 App Store Connect API 密钥走云端托管的分发证书，私钥不出 Apple，CI 上不放分发证书。
      # - 归档时 Xcode 要一张本机有私钥的开发证书。不给的话它每次用密钥新建一张，团队里越攒越多，
      #   所以固定用 secrets 里这一张。
      - name: Import signing credentials
        env:
          ASC_KEY_P8: ${{ secrets.SMELT_ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.SMELT_ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.SMELT_ASC_API_ISSUER_ID }}
          DEV_CERT_P12_BASE64: ${{ secrets.SMELT_IOS_DEV_CERT_P12_BASE64 }}
          DEV_CERT_P12_PASSWORD: ${{ secrets.SMELT_IOS_DEV_CERT_P12_PASSWORD }}
        run: |
          for var in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID DEV_CERT_P12_BASE64 DEV_CERT_P12_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "✗ 没配置 iOS 签名的 secret（${var}），见 docs/release.md 的「iOS 签名」。"
              exit 1
            fi
          done

          umask 077
          key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          {
            echo "SMELT_ASC_KEY_PATH=$key_path"
            echo "SMELT_ASC_KEY_ID=$ASC_KEY_ID"
            echo "SMELT_ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

          # 钥匙串的做法同上面 build job 的 Import codesign identity。
          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$DEV_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dev-cert.p12"
          security import "$RUNNER_TEMP/dev-cert.p12" -k "$KEYCHAIN" -P "$DEV_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dev-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          EXISTING="$(security list-keychains -d user | sed 's/[\" ]//g')"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

      # 出包前会核对当前提交就是这个 tag、代码没有改动。
      - name: Build and upload to TestFlight
        run: scripts/build-ios.sh --upload

      - name: Clean up signing credentials
        if: always()
        run: |
          rm -f "${SMELT_ASC_KEY_PATH:-}"
          [[ -n "${KEYCHAIN_PATH:-}" ]] && security delete-keychain "$KEYCHAIN_PATH" || true

  # Windows 本机运行时：smelt、smeltd、smelt-notify、smelt-pi 装在同一个目录里，打成 Inno Setup
  # 安装程序（scripts/windows-installer.iss）。第一版不签名。
  # 构建和 dmg 并行；上传在 windows-release，等 Release 建好再挂，避免两边同时建。
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Version from tag
        shell: bash
        run: echo "SMELT_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p smelt -p smelt-cli -p smeltd --locked

      # GitHub 的 windows-latest 默认是 PowerShell，仓库里的 Bun 脚本是 bash。
      - name: Build smelt-pi
        shell: bash
        run: bash scripts/build-smelt-pi.sh --out target/smelt-pi

      # Inno Setup 7 自带简体中文界面。钉版本、对哈希，不用 choco 装「最新版」。
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          $sha256 = "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f"
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne $sha256) { throw "Inno Setup 安装程序的哈希对不上" }
          $dir = "$env:RUNNER_TEMP\inno"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup 没装上" }
          "INNO_DIR=$dir" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          # 文件版本只能是数字段：2026.1026.0-rc.2 取 2026.1026.0。
          $numeric = ($version -split '-')[0]
          $stage = "dist/stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/smelt.exe, target/release/smeltd.exe, target/release/smelt-notify.exe -Destination $stage
          # 控制台入口。cmd / PowerShell 敲 smelt 先找到 .com，命令行子命令才有输出。
          Copy-Item target/release/smelt-cli.exe -Destination "$stage/smelt.com"
          Copy-Item target/smelt-pi/smelt-pi.exe, target/smelt-pi/photon_rs_bg.wasm -Destination $stage
          if (Test-Path target/smelt-pi/skills) { Copy-Item target/smelt-pi/skills -Destination $stage -Recurse }
          if (Test-Path target/smelt-pi/native) { Copy-Item target/smelt-pi/native -Destination $stage -Recurse }
          & "$env:INNO_DIR\ISCC.exe" -q `
            "/DAppVersion=$version" `
            "/DAppVersionNumeric=$numeric" `
            "/DStageDir=$((Resolve-Path $stage).Path)" `
            "/DOutputDir=$((Resolve-Path dist).Path)" `
            scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编安装程序失败（退出码 $LASTEXITCODE）" }
          $name = "smelt-$version-windows-x86_64-setup.exe"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          Write-Output "$hash  $name"
          Get-Item "dist/$name" | Select-Object Name, Length

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: smelt-windows
          path: dist/smelt-*-windows-x86_64-setup.exe
          if-no-files-found: error

  windows-release:
    needs: [build, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: smelt-windows
          path: dist

      - name: Add to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/smelt-*-windows-x86_64-setup.exe
          prerelease: ${{ contains(github.ref_name, '-') }}

  # 所有产物都上传后，把 SHA256SUMS 重写成覆盖全部产物（dmg、自更新 zip、APK、
  # Linux 包、Windows 安装程序、install.sh）。
  checksums:
    needs: [linux-release, android-release, windows-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Checksums of all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cd dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Smelt.dmg' --pattern 'Smelt.app.zip' --pattern 'Smelt-*.apk' --pattern 'smeltd-*.tar.gz' --pattern 'smelt-*-windows-x86_64-setup.exe' --pattern 'install.sh'
          sha256sum -- * | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
