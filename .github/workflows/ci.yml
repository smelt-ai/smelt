# 每次 PR 与 main 推送都跑 Rust 与 Flutter 的检查。发版流程另见 release.yml。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新推送会取消仍在跑的旧任务，两个 job 都要装重量级工具链，
# 排队重跑没有意义。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # GPUI 只在 macOS 上编得过，且 runner 必须是 Apple Silicon（同 release.yml）。
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # GPUI 等 git 依赖编译很慢，缓存 cargo registry 与 target。
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 这里不跑 cargo fmt --check：仓库从来没有 rustfmt 干净过（main 上百余处
      # 漂移），加上去只会一上来就红，把真正的信号淹掉。要么先整体格式化一次，
      # 那是独立的一次改动。
      #
      # 用 nextest 而不是 cargo test：smeltd 的 resume_handoff 测试摆弄的是进程级
      # 的全局状态（fd 表、waitpid、进程组），同一个进程里跑就会互相串味——原样
      # 跑大约五次挂一次，串行也照挂。nextest 每个测试起一个独立进程，这个干扰
      # 就不存在了。
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # 跳掉的两组测试都不是这里能给出有效信号的：
      #
      # - damage_gate_tests 走 Terminal::spawn 的完整生产路径，要一个真的 PTY、
      #   真的 shell，以及本机活着的 smeltd。runner 上没有。
      # - short_ordered_list_bubble_does_not_collapse_below_min_width 在 main 上
      #   就是红的：gpui 的测试平台对 test window 抛 `not implemented: Test
      #   Windows are not backed by a real platform window`，是 zed 依赖升级带来
      #   的，与被测逻辑无关。修好后把它从下面的表达式里去掉。
      - name: Run tests
        run: |
          cargo nextest run --workspace -E '
            not test(damage_gate_tests)
            and not test(short_ordered_list_bubble_does_not_collapse_below_min_width)
          '

  mobile:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 也是在验证 xterm 那条 git 依赖能解析：它指向 smelt-ai/xterm.dart 的一个
      # commit，pub 上没有，解析不了的话这一步就直接红。
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # 上面的 mobile job 只跑纯 Dart，碰不到原生那一半。Android 的风险恰恰都在原生
  # 侧：cargokit 要用 NDK 把 crates/smelt-mobile 交叉编成 .so 再塞进 APK，
  # Gradle / AGP / cargokit 三者的版本组合很容易在升级时炸掉，而这只有真编一次
  # 才看得出来。
  #
  # 只编 arm64：真机几乎全是 arm64，多编一个 ABI 就多一份 Rust 依赖树的交叉编译。
  # 用 ubuntu 而不是 macos runner：Android 构建不需要 macOS，且 Linux runner 更
  # 便宜、配额更宽松。
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gradle 9.1 / AGP 9 目前支持到 JDK 25，runner 默认的 JDK 未必在范围内，
      # 钉一个已知可用的。
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 版本要和 mobile/rust_builder/android/build.gradle 里写死的那份一致，
      # 也就是 Flutter 模板的 flutter.ndkVersion。
      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/smelt-mobile

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 不带签名配置，app/build.gradle.kts 会退回 debug 签名。这里只验证能不能
      # 编过，可分发的包由发版流水线单独出。
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64
