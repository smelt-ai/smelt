# PR 与 main 推送都跑；只跑这次改动波及的 job，发版流程另见 release.yml。
#
# main 上那次不是重复劳动：GitHub 的缓存按分支隔离，只有 main 存的缓存所有 PR 都能读。
# 所以缓存只在 main 上写（save-if），PR 只读——否则每个 PR 各存一份 2GB+，很快顶到
# 仓库 10GB 的上限，把 main 那份挤掉，后面的 PR 全变冷启动。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR 上新推送会取消仍在跑的旧任务：工具链都很重，旧提交的结果已经没人看。
# main 上每次推送各跑各的（按 sha 分组）：它要产出给 PR 共用的缓存，被紧接着的
# 下一次合并取消的话，缓存就存不下来。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 按改动路径决定跑哪些 job。只改文档时全部跳过，由 ci-ok 汇总成通过。
  # 手动触发（workflow_dispatch）时全部跑。
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      advisories: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.advisories == 'true' }}
      mobile: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mobile == 'true' }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
      pi-agent: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.pi-agent == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # rust：整个 workspace 的输入。smelt-core 的 build.rs 只读 packages/pi-agent 的版本号，
          # 桌面与 smeltd 会嵌 assets/，所以这两处也算。
          # android：手机内核 smelt_mobile 及其依赖的 crate（`cargo tree -p smelt_mobile`
          # 里的本地 crate，加依赖时同步这里）和 Flutter 工程。ios-check 也看它。
          # advisories：只在依赖图或 deny 配置可能变时跑（cargo deny 本身很快，但拉
          # advisory-db 要网络；纯 .rs 改动不必每次扫）。
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            toolchain: &toolchain
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
            rust:
              - *workflow
              - *toolchain
              - 'crates/**'
              - 'packages/**'
              - 'assets/**'
            advisories:
              - *workflow
              - *toolchain
              - 'deny.toml'
              - 'crates/**/Cargo.toml'
            mobile:
              - *workflow
              - 'mise.toml'
              - 'mobile/**'
            android:
              - *workflow
              - *toolchain
              - 'mise.toml'
              - 'mobile/**'
              - 'crates/smelt-mobile/**'
              - 'crates/smelt-model/**'
              - 'crates/smelt-runtime-client/**'
              - 'crates/smelt-iroh/**'
              - 'crates/smelt-pairing/**'
              - 'crates/smelt-event-protocol/**'
              - 'crates/smelt-paths/**'
            pi-agent:
              - *workflow
              - 'scripts/fetch-bun.sh'
              - 'scripts/build-smelt-pi.sh'
              - 'scripts/compile-smelt-pi.ts'
              - 'scripts/compiled-smoke.ts'
              - 'packages/pi-agent/**'

  # RustSec：只查 advisories，不跑 license/bans（那些噪声大、与本 PR 目标无关）。
  # ubuntu 上跑：不编代码，只要 cargo metadata + advisory-db，通常几十秒内结束。
  cargo-deny:
    needs: changes
    if: needs.changes.outputs.advisories == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 跟 rust-toolchain.toml 对齐；cargo-deny-action 默认镜像的 rustc 偏旧，
      # edition 2024 / rust-version 1.97 的 workspace 元数据解析会踩坑。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 与 nextest 一样用 install-action：比整镜像换工具链更贴本仓库习惯，也避免
      # Embark 镜像里自带的旧 rustc。
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check advisories
        run: cargo deny check advisories

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # 整个 workspace 都编（GPUI 在 Linux 上编不过），runner 要 Apple Silicon（同 release.yml）。
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # GPUI 等 git 依赖编译很慢，缓存 cargo registry 与 target。只在 main 上写，见文件头。
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 这里不跑 cargo fmt --check：仓库从来没有 rustfmt 干净过（main 上百余处
      # 漂移），加上去只会一上来就红，把真正的信号淹掉。要么先整体格式化一次，
      # 那是独立的一次改动。
      #
      # 用 nextest 而不是 cargo test：每个测试一个独立进程。不少测试碰进程级状态
      # （环境变量、子进程、进程组、信号），同一个进程里跑会互相串味。
      # 不靠 clippy：这个 job 不跑 clippy，GUI crate 在 Linux 上也编不进来。
      # 手型光标是调用点约定，grep 能在编译之前就失败。
      - name: 禁止手型光标
        run: ./scripts/lint-pointer.sh

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # 跳掉的两组测试都不是这里能给出有效信号的：
      #
      # - damage_gate_tests 走 Terminal::spawn 的完整生产路径，要一个真的 PTY、
      #   真的 shell，以及本机活着的 smeltd。runner 上没有。
      # - short_ordered_list_bubble_does_not_collapse_below_min_width 在 main 上
      #   就是红的：gpui 的测试平台对 test window 抛 `not implemented: Test
      #   Windows are not backed by a real platform window`，是 zed 依赖升级带来
      #   的，与被测逻辑无关。修好后把它从下面的表达式里去掉。
      - name: Run tests
        run: |
          cargo nextest run --workspace -E '
            not test(damage_gate_tests)
            and not test(short_ordered_list_bubble_does_not_collapse_below_min_width)
          '

  # Windows 本机运行时（docs/windows-support.md）：桌面、smeltd 和它们的依赖
  # 在 windows-latest 上原生编译、跑测试。Unix 专用测试用 cfg 跳过。
  windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    # 不用缓存：仓库缓存上限 10GB，macOS 那份已经 3GB，再存一份 Windows 的会互相挤掉。
    # 于是每次全量编译；不要调试信息，链接快得多。测试只看通过与否。
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # 本机运行时这条链在 Windows 上换了实现，单测在这里真跑一遍。编译错误也在这一步报，
      # 不再单独 cargo check：check 只出元数据，测试还得从头再编一遍，白花 8 分钟。
      - name: Run tests
        run: cargo nextest run -p smelt-sys -p smelt-paths -p smelt-client-store -p smelt-model -p smelt-runtime-client -p smelt-iroh -p smelt-client -p smelt-cli -p smelt-store -p smelt-git -p smelt-core -p smeltd -p smelt

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本钉在仓库根的 mise.toml，与本地开发同一份；只装 Flutter，CocoaPods 这里用不到。
      # 不开缓存：Flutter SDK 解压后约 4GB，会挤掉仓库 10GB 配额里的 Rust 缓存，现下载更划算。
      - name: Install Flutter
        uses: jdx/mise-action@v5
        with:
          install_args: flutter
          cache: false

      # 也是在验证 xterm 那条 git 依赖能解析：它指向 smelt-ai/xterm.dart 的一个
      # commit，pub 上没有，解析不了的话这一步就直接红。
      - name: Install dependencies
        run: flutter pub get

      # 文案按功能分片写在 lib/l10n/src，合并出的 app_*.arb 与生成的 L10n 类都提交在库里；
      # 改了片段忘了合并，这一步就红。
      - name: Check l10n
        run: dart run tool/merge_arb.dart --check && flutter gen-l10n && git diff --exit-code -- lib/l10n

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # 上面的 mobile job 只跑纯 Dart，碰不到原生那一半。Android 的风险恰恰都在原生
  # 侧：cargokit 要用 NDK 把 crates/smelt-mobile 交叉编成 .so 再塞进 APK，
  # Gradle / AGP / cargokit 三者的版本组合很容易在升级时炸掉，而这只有真编一次
  # 才看得出来。
  #
  # 只编 arm64：真机几乎全是 arm64，多编一个 ABI 就多一份 Rust 依赖树的交叉编译。
  # 用 ubuntu 而不是 macos runner：Android 构建不需要 macOS，且 Linux runner 更
  # 便宜、配额更宽松。
  android-build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gradle 9.1 / AGP 9 目前支持到 JDK 25，runner 默认的 JDK 未必在范围内，
      # 钉一个已知可用的。
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        # v3 默认还装已下线的 `tools` 包，sdkmanager 直接失败。
        uses: android-actions/setup-android@v4

      # 版本要和 mobile/rust_builder/android/build.gradle 里写死的那份一致，
      # 也就是 Flutter 模板的 flutter.ndkVersion。
      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # cargokit 不用 crates/smelt-mobile/target，而是把 Rust 编进 Gradle 给插件工程的
      # 构建目录（rust_builder/cargokit/gradle/plugin.gradle 的 cargoBuildDir）。缓存要
      # 指到那里，否则每次 APK 构建都从头交叉编译整棵依赖树。
      # shared-key 要和 release.yml 的 android 一致：缓存键默认带 job 名，两边 job 名
      # 不同，发版那边就一直读不到这里存的。
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          workspaces: ". -> mobile/build/rust_lib_smelt_mobile/build/release"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 版本钉在仓库根的 mise.toml，与本地开发同一份；只装 Flutter，CocoaPods 这里用不到。
      # 不开缓存：Flutter SDK 解压后约 4GB，会挤掉仓库 10GB 配额里的 Rust 缓存，现下载更划算。
      - name: Install Flutter
        uses: jdx/mise-action@v5
        with:
          install_args: flutter
          cache: false

      # 不带签名配置，app/build.gradle.kts 会退回 debug 签名。这里只验证能不能
      # 编过，可分发的包由发版流水线单独出。
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64

  # iOS 一侧只检查手机内核能不能编过 aarch64-apple-ios：依赖在 iOS 上编不过（比如 netdev
  # 用了 macOS 才有的 libc 类型）这类问题，不在这里拦就只能等发版出包时才暴露。完整出包要签名，
  # 留给发版流水线；cargo check 不链接，也就不用 Flutter 和 Xcode 工程。
  # 不用缓存，原因同 windows job。
  ios-check:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rust-toolchain.toml 钉了版本，target 要装到那一份上：在仓库里不带参数的
      # rustup toolchain install 装的就是钉住的那份，随后的 target add 也加到它上面。
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios

      - name: Check smelt_mobile for iOS
        run: cargo check -p smelt_mobile --target aarch64-apple-ios --locked

  # Pi 运行时（TypeScript）：类型检查 + bun 单测。Bun 版本跟打包进 App 的那份一致。
  pi-agent:
    needs: changes
    if: needs.changes.outputs.pi-agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pi-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 与 scripts/fetch-bun.sh 的 BUN_VERSION 保持一致。
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

  # Windows 上把 smelt-pi 编出来跑一遍冒烟：嵌入文件的路径、可执行文件后缀都和
  # macOS / Linux 不一样，本地开发机上测不到，不在这里跑就只能等发版时才暴露。
  pi-agent-windows:
    needs: changes
    if: needs.changes.outputs.pi-agent == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and smoke smelt-pi
        shell: bash
        run: bash scripts/build-smelt-pi.sh --out target/smelt-pi

  # 唯一的必需检查（分支保护里只要求它）。被跳过的 job 算通过；任何一个失败或被取消
  # 就失败。这样按路径跳过的 job 不会把 PR 卡在「等待检查」。
  ci-ok:
    if: always()
    needs: [changes, cargo-deny, rust, mobile, android-build, ios-check, windows, pi-agent, pi-agent-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "✗ 有 job 失败或被取消"
            exit 1
          fi
