version: 2
updates:
  - package-ecosystem: bun
    directory: /website
    schedule:
      interval: weekly

  - package-ecosystem: bun
    directory: /packages/pi-agent
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # libc 在 iOS 上封顶 <0.2.190，原因和解除条件见 crates/smelt-mobile/Cargo.toml。
    # 不忽略的话 dependabot 会连上限一起改高，iOS 又编不过（#121）。
    ignore:
      - dependency-name: libc
        versions: [">=0.2.190"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
