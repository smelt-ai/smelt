// Android Gradle Plugin 负责调 NDK 编 Rust（实际交给 cargokit）。
//
// 这里不再自带 `buildscript { classpath 'com.android.tools.build:gradle:x' }`：
// 那是 cargokit/flutter_rust_bridge 老模板的写法，会和 app 侧
// `android/settings.gradle.kts` 里 pluginManagement 声明的 AGP 版本打架，
// AGP 8+ 直接报 plugin 版本冲突。作为 Flutter 插件模块，版本统一由宿主 app 决定。

group = "com.flutter_rust_bridge.rust_lib_smelt_mobile"
version = "1.0"

apply plugin: "com.android.library"

android {
    namespace = "com.flutter_rust_bridge.rust_lib_smelt_mobile"

    // 跟随 Flutter 当前模板（flutter.compileSdkVersion / flutter.ndkVersion）。
    // 插件的 compileSdk 不能高于宿主 app，改这里要同步 android/app/build.gradle.kts。
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // 与 Flutter 的 flutter.minSdkVersion 对齐；低于宿主 app 会在 manifest
        // 合并时报 uses-sdk 冲突。
        minSdk = 24
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../../crates/smelt-mobile"
    libname = "smelt_mobile"
}
