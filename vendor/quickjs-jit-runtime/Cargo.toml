[dependencies.rquickjs-core]
version = "=0.14.1"
features = [
    "jit-abi",
    "loader",
]
package = "quickjs-jit-core"

[dependencies.rustc-hash]
version = "2.1"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.serde_yaml]
version = "0.9"

[dev-dependencies.criterion]
version = "0.5"

[dev-dependencies.static_assertions]
version = "1"

[dev-dependencies.trybuild]
version = "1"

[build-dependencies.rquickjs-sys]
version = "=0.14.1"
features = ["jit-abi"]
package = "quickjs-jit-sys"

[target.'cfg(all(target_endian = "little", any(target_os = "linux", target_os = "macos"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies.libc]
version = "0.2"

[target.'cfg(all(target_endian = "little", target_os = "windows", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
]

[target.'cfg(not(target_family = "wasm"))'.dependencies.cranelift-codegen]
version = "0.116"
features = [
    "x86",
    "arm64",
    "enable-serde",
]
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.cranelift-frontend]
version = "0.116"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.cranelift-module]
version = "0.116"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.cranelift-native]
version = "0.116"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.cranelift-object]
version = "0.116"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.gimli]
version = "0.31"
features = [
    "write",
    "std",
]
optional = true
default-features = false

[target.'cfg(not(target_family = "wasm"))'.dependencies.postcard]
version = "1"
features = ["alloc"]
optional = true
default-features = false

[target.'cfg(not(target_family = "wasm"))'.dependencies.target-lexicon]
version = "0.13"
optional = true
