# SMELT: longbridge/gpui-kit 4373234ff46df3a3227972788a41dc6603d352ce 的 crates/shell 原样拷来，
# 改动处标 `SMELT:`（见仓库根 Cargo.toml 的 [patch]）。清单把上游工作区继承的依赖展开成同一修订，
# 去掉了二进制、开发依赖和上游工作区的 lints。
[package]
name = "gpui-shell"
description = "A scriptable application runtime for GPUI, built on gpui-base."
version = "0.10.0"
license = "Apache-2.0"
publish = false
edition = "2024"
repository = "https://github.com/longbridge/gpui-kit"

[lib]
name = "gpui_shell"
path = "src/lib.rs"

[features]
gpui-fast = [
    "dep:gpui-fast",
    "dep:gpui-fast-platform",
    "gpui-base/gpui-fast",
    "gpui-fps/gpui-fast",
    "gpui-component?/gpui-fast",
    "gpui-kit/gpui-fast",
    "gpui-webview?/gpui-fast",
]
default = ["quickjs", "components", "webview"]
components = ["dep:gpui-component"]
webview = ["components", "gpui-fast", "dep:gpui-webview", "dep:wry"]
quickjs = [
    "dep:rquickjs",
    "dep:rquickjs-jit",
    "dep:quickjs-jit-stdlib",
    "dep:reqwest",
    "dep:tungstenite",
]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-fast = { package = "gpui-fast", version = "0.1.17", features = ["windows-manifest-provided-by-host"], optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-fast-platform = { package = "gpui-fast-platform", version = "0.1.17", features = ["font-kit", "x11", "wayland", "runtime_shaders"], optional = true }
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "4373234ff46df3a3227972788a41dc6603d352ce", features = ["inspector"] }
gpui-fps = { git = "https://github.com/longbridge/gpui-kit", rev = "4373234ff46df3a3227972788a41dc6603d352ce" }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "4373234ff46df3a3227972788a41dc6603d352ce", features = ["syntect"], optional = true }
gpui-webview = { git = "https://github.com/longbridge/gpui-kit", rev = "4373234ff46df3a3227972788a41dc6603d352ce", optional = true }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "4373234ff46df3a3227972788a41dc6603d352ce", default-features = false }
wry = { version = "0.53.3", package = "lb-wry", optional = true }

rquickjs = { package = "quickjs-jit", version = "=0.14.1", features = ["macro", "loader", "jit-abi"], optional = true }
rquickjs-jit = { package = "quickjs-jit-runtime", version = "=0.14.1", features = ["compiler"], optional = true }
quickjs-jit-stdlib = { version = "=0.14.1", default-features = false, features = ["buffer", "crypto", "path", "url", "zlib"], optional = true }
jiff = "1.0"
cap-std = "4.0.3"
async-channel = "2.5"
fs2 = "0.4"
sha2 = "0.10"
wait-timeout = "0.2"
reqwest = { package = "gpui-pre-reqwest", version = "=0.12.15", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], optional = true }
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots", "url"], optional = true }

anyhow = "1"
instant = { version = "0.1", features = ["wasm-bindgen"] }
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1.1"
tar = { version = "0.4", default-features = false }
schemars = "1"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
smallvec = "1"
smol = "2"
usvg = { version = "0.46", default-features = false }
tracing = "0.1.41"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58.0", features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
