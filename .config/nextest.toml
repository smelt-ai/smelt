# nextest 的配置。跑法本身在 .github/workflows/ci.yml 里。

[profile.default]
# 默认不重试：一个测试挂了就是挂了，别把真问题重试成绿的。
retries = 0

# 唯一的例外是 smeltd 的 resume_handoff_tests。这一组用例本身带竞态：
# make_fake_pty 拿 `true` 退出后的僵尸 pid 当交接对象，恢复路径要对这个 pid
# 做校验，过不过取决于子进程恰好走到哪一步。实测大约五次跑挂一次，改串行、
# 换 nextest 的进程隔离都拦不住，说明 race 在用例自己的写法里。
#
# 这是本文件写下之前就有的老问题，跟它测的东西无关，也不该让整条流水线随机
# 变红。先给两次重试兜底；等这组用例改成不依赖僵尸 pid 的时序之后，把下面
# 整段删掉。
[[profile.default.overrides]]
filter = 'package(smeltd) and test(resume_handoff_tests)'
retries = 2
