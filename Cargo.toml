# 虚拟 workspace：所有代码住 crates/ 下，根不再有 package。
# - crates/smelt-store  —— 桌面 SQLite/KV 与 legacy 导入事务原语（移动端不编 native SQLite）
# - crates/smelt-pairing —— 桌面/移动端共用的配对码格式
# - crates/smelt-push  —— 手机推送的线上格式（运行时、手机 → 推送中继）
# - crates/smelt-push-relay —— 推送中继：持有 APNs 私钥，替 smeltd 转发推送
# - crates/smelt-version —— 编译时从 SMELT_VERSION 注入的版本号（见 scripts/version.sh）
# - crates/smelt-runtime-client —— smeltd wire 契约与协议客户端（桌面/移动端共用，能编进移动端）
# - crates/smelt-client-store —— 桌面客户端自己的库 client.sqlite3（外观、界面状态等）
# - crates/smelt-core   —— GUI 与守护共用的无 UI 逻辑（不许引 GPUI）
# - crates/smelt-git    —— Git 领域层（仓库发现/状态/diff/写操作，不含 UI）
# - crates/smeltd       —— 守护侧两个二进制（smeltd / smelt-notify）
# - crates/smelt        —— GUI 主程序（bin 名 smelt，与产品名统一）
[workspace]
members = [
    "crates/smelt-paths",
    "crates/smelt-version",
    "crates/smelt-sys",
    "crates/smelt-model",
    "crates/smelt-client",
    "crates/smelt-cli",
    "crates/smelt-event-protocol",
    "crates/smelt-event-bus",
    "crates/smelt-store",
    "crates/smelt-pairing",
    "crates/smelt-push",
    "crates/smelt-push-relay",
    "crates/smelt-runtime-client",
    "crates/smelt-client-store",
    "crates/smelt-core",
    "crates/smelt-git",
    "crates/smeltd",
    "crates/smelt-ui",
    "crates/smelt-desktop",
    "crates/smelt-terminal",
    "crates/smelt-acp",
    "crates/smelt-plugin-api",
    "crates/smelt-nsh",
    "crates/smelt",
    "crates/smelt-iroh",
    "crates/smelt-mobile", # package 名是 smelt_mobile（cargokit 要求，见其 Cargo.toml）
]
resolver = "3"

# 版本号不写在这里：发版只打 tag，打包时从 tag 算出版本号，经 SMELT_VERSION 编进程序
# （crates/smelt-version，规则见 docs/release.md 的「版本号」）。这里固定 0.0.0，不要改。
[workspace.package]
version = "0.0.0"
edition = "2024"
# 与 rust-toolchain.toml 一致。成员 crate 未一律 inherit，钉编译器靠 toolchain 文件。
# gpui-pre-macos 0.3.10 起用了 1.98 才稳定的 `Option::map_or_default`。
rust-version = "1.98.0"
# 本仓库全部 crate 以 Apache-2.0 开源，只随 app 分发，不发 crates.io。
# 商业版私有仓里的闭源 crate 自己声明许可，不继承这里。
license = "Apache-2.0"
publish = false

[workspace.dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
dirs = "6"
sha2 = "0.11"
similar = "3"
thiserror = "2"
# 界面文案（docs/i18n.md）：插件、组件库、宿主各自带 locales/ui.yml。和 gpui-kit 同一套。
rust-i18n = "4.2"

[patch.crates-io]
# gpui-kit 0.8.1（611b55e331170ca375214d580b6c5409db858f83）起，gpui-shell 直接依赖
# crates.io 的 `quickjs-jit` / `quickjs-jit-stdlib` =0.14.1，工作区里不再有
# `rquickjs` 兼容门面。旧 patch 指向的包已从该修订删除。
# netdev 0.46.x（iroh → netwatch 引入）在 iOS 上调用了 iOS 不开放的 SystemConfiguration API
# （API_UNAVAILABLE(ios)，上架审核会拒），还用了 macOS 才有的 `in6_ifreq`。上游在 0.47.0 修了，
# 但 netwatch 还要求 ^0.46.3，所以钉修复所在的提交：它的版本号仍是 0.46.3，之后的 0.47.0 只改了版本号。
# netwatch 升到 netdev 0.47 后删掉这条，那时 cargo 会警告这条 patch 没用上。上游官方仓库，不是 fork。
# libc 的上限另见 crates/smelt-mobile/Cargo.toml。
netdev = { git = "https://github.com/shellrow/netdev", rev = "b3bfb0fb5595cd143bfa0b9f07d1ad6e0ef0c313" }

# gpui-fast 用我们的 fork：源码长期单分支 `smelt/release`，发布态 Crate 工作区由
# `bun script/prepare-release.ts --tag v0.1.19` 生成并推到 `smelt/crates` 分支。
gpui-fast = { git = "https://github.com/smelt-ai/gpui-fast", rev = "9064725bfba934bc642646db6c871cbb1197c207" }
gpui-fast-apple = { git = "https://github.com/smelt-ai/gpui-fast", rev = "9064725bfba934bc642646db6c871cbb1197c207" }
gpui-fast-linux = { git = "https://github.com/smelt-ai/gpui-fast", rev = "9064725bfba934bc642646db6c871cbb1197c207" }
gpui-fast-macos = { git = "https://github.com/smelt-ai/gpui-fast", rev = "9064725bfba934bc642646db6c871cbb1197c207" }
gpui-fast-macros = { git = "https://github.com/smelt-ai/gpui-fast", rev = "9064725bfba934bc642646db6c871cbb1197c207" }
gpui-fast-platform = { git = "https://github.com/smelt-ai/gpui-fast", rev = "9064725bfba934bc642646db6c871cbb1197c207" }
gpui-fast-scheduler = { git = "https://github.com/smelt-ai/gpui-fast", rev = "9064725bfba934bc642646db6c871cbb1197c207" }
gpui-fast-web = { git = "https://github.com/smelt-ai/gpui-fast", rev = "9064725bfba934bc642646db6c871cbb1197c207" }
gpui-fast-wgpu = { git = "https://github.com/smelt-ai/gpui-fast", rev = "9064725bfba934bc642646db6c871cbb1197c207" }
gpui-fast-windows = { git = "https://github.com/smelt-ai/gpui-fast", rev = "9064725bfba934bc642646db6c871cbb1197c207" }

# NSH 用我们的 fork：长期单分支 `smelt/release`，不强推、不打标签；同步上游发版直接 merge
# 对应 tag，这里十个包一起换到同一个 rev。
nsh-base = { git = "https://github.com/smelt-ai/nsh", rev = "74e9f51822d80b15236c9ab620c3ef95850eb253" }
nsh-bundler = { git = "https://github.com/smelt-ai/nsh", rev = "74e9f51822d80b15236c9ab620c3ef95850eb253" }
nsh-core = { git = "https://github.com/smelt-ai/nsh", rev = "74e9f51822d80b15236c9ab620c3ef95850eb253" }
nsh-engine = { git = "https://github.com/smelt-ai/nsh", rev = "74e9f51822d80b15236c9ab620c3ef95850eb253" }
nsh-i18n = { git = "https://github.com/smelt-ai/nsh", rev = "74e9f51822d80b15236c9ab620c3ef95850eb253" }
nsh-js = { git = "https://github.com/smelt-ai/nsh", rev = "74e9f51822d80b15236c9ab620c3ef95850eb253" }
nsh-macros = { git = "https://github.com/smelt-ai/nsh", rev = "74e9f51822d80b15236c9ab620c3ef95850eb253" }
nsh-package = { git = "https://github.com/smelt-ai/nsh", rev = "74e9f51822d80b15236c9ab620c3ef95850eb253" }
nsh-platform-gpui = { git = "https://github.com/smelt-ai/nsh", rev = "74e9f51822d80b15236c9ab620c3ef95850eb253" }
nsh-updater = { git = "https://github.com/smelt-ai/nsh", rev = "74e9f51822d80b15236c9ab620c3ef95850eb253" }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
needless_borrow = "warn"
unnecessary_to_owned = "warn"
unnecessary_sort_by = "warn"
collapsible_if = "warn"
cloned_ref_to_slice_refs = "warn"
redundant_clone = "warn"
# `while let` / `match` / `if let` 条件里拿的锁守卫活到整个代码块结束：在里面等别的线程，
# 那边要拿同一把锁就互相卡住（补做写回曾因此每次等满 10 秒）。先取值放锁，再判断。
significant_drop_in_scrutinee = "warn"
# 正确性闸门：空 dbg/todo 不应进主线。存量 style 警告不在这里 deny，避免一次清不完。
dbg_macro = "deny"
todo = "deny"

# proc-macro 和 build script 只在构建机上用，不发布，不用 strip。
# rustc 1.97 在 macOS 上用 `rust-objcopy --strip-debug` 实现默认的 strip=debuginfo，处理后的
# dylib 有时 LINKEDIT 字符串表不对齐（跟产物内容有关），macOS 27 的 dyld 拒绝加载，rustc 就报
# `can't find crate for rquickjs_macro`（2026-10-19 复现；系统 `strip -S` 处理同一文件没问题）。
[profile.release.build-override]
strip = false
