# 虚拟 workspace：所有代码住 crates/ 下，根不再有 package。
# - crates/smelt-store  —— 桌面 SQLite/KV 与 legacy 导入事务原语（移动端不编 native SQLite）
# - crates/smelt-pairing —— 桌面/移动端共用的配对码格式
# - crates/smelt-remote-gateway —— 移动端远程 ACP/终端网关（不含 GPUI）
# - crates/smelt-core   —— GUI 与守护共用的无 UI 逻辑（不许引 GPUI）
# - crates/smelt-git    —— Git 领域层（仓库发现/状态/diff/写操作，不含 UI）
# - crates/smeltd       —— 守护侧三个二进制（smeltd / gateway / smelt-notify）
# - crates/smelt        —— GUI 主程序（bin 名 smelt，与产品名统一）
[workspace]
members = [
    "crates/smelt-paths",
    "crates/smelt-plugin-api",
    "crates/smelt-plugin-host",
    "crates/smelt-process-wait",
    "crates/smelt-event-bus",
    "crates/smelt-store",
    "crates/smelt-pairing",
    "crates/smelt-remote-gateway",
    "crates/smelt-core",
    "crates/smelt-git",
    "crates/smeltd",
    "crates/smelt-ui",
    "crates/smelt-webview",
    "crates/smelt-acp-view",
    "crates/smelt",
    "crates/smelt-iroh",
    "crates/smelt-mobile", # package 名是 smelt_mobile（cargokit 要求，见其 Cargo.toml）
]
resolver = "3"

# 版本号唯一真源：发版只改这里（scripts/package-mac.sh 与 release CI 都
# grep 本文件的 '^version' 行做校验），各成员 version.workspace = true 继承。
[workspace.package]
version = "0.9.0"
edition = "2024"
# 与 rust-toolchain.toml 一致。成员 crate 未一律 inherit，钉编译器靠 toolchain 文件。
rust-version = "1.97.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[patch.crates-io]
# GPUI 用 crates.io 的 gpui-pre =0.3.9，即 gpui-kit 钉的快照。先不用 gpui-fast。
# gpui-shell 的标准库（LLRT 模块）依赖 crates.io 的 `rquickjs`，gpui-kit 在它自己的
# 工作区里把它 patch 成转发到 quickjs-jit 的兼容包，两边才是同一套类型和 VM。
# patch 不随依赖传递，所以这里照抄一份，来源必须和下面的 gpui-kit 一致。
rquickjs = { git = "https://github.com/zzfn/gpui-kit", rev = "073a87951971a9f7be8587942861b8692525d8de" }

# gpui-kit 临时换成 fork：zzfn/gpui-kit 的 `smelt` 分支 = 上游 1e7ffaa + gpui-shell
# 嵌入宿主需要的改动（PluginManager::load_with_policy、set_editor_files、退出时
# 任务表已销毁则跳过取消），待提上游。
# 各 crate 的依赖声明不动，切换只在这一处；上游合并后删掉整段、把 rev 升到合并后的上游。
# 用到的 gpui-kit 包必须整套一起换，混用会出现两份 gpui_base。
# 本地改 fork 时可临时把这里换成 path = "../../wawa/gpui-kit/crates/..."，别提交。
[patch."https://github.com/longbridge/gpui-kit"]
gpui-base = { git = "https://github.com/zzfn/gpui-kit", rev = "073a87951971a9f7be8587942861b8692525d8de" }
gpui-component = { git = "https://github.com/zzfn/gpui-kit", rev = "073a87951971a9f7be8587942861b8692525d8de" }
gpui-fps = { git = "https://github.com/zzfn/gpui-kit", rev = "073a87951971a9f7be8587942861b8692525d8de" }
gpui-kit-assets = { git = "https://github.com/zzfn/gpui-kit", rev = "073a87951971a9f7be8587942861b8692525d8de" }
gpui-shell = { git = "https://github.com/zzfn/gpui-kit", rev = "073a87951971a9f7be8587942861b8692525d8de" }
gpui-component-shell = { git = "https://github.com/zzfn/gpui-kit", rev = "073a87951971a9f7be8587942861b8692525d8de" }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
needless_borrow = "warn"
unnecessary_to_owned = "warn"
unnecessary_sort_by = "warn"
collapsible_if = "warn"
cloned_ref_to_slice_refs = "warn"
redundant_clone = "warn"
# 正确性闸门：空 dbg/todo 不应进主线。存量 style 警告不在这里 deny，避免一次清不完。
dbg_macro = "deny"
todo = "deny"
