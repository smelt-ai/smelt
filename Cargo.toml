# 虚拟 workspace：所有代码住 crates/ 下，根不再有 package。
# - crates/smelt-store  —— 桌面 SQLite/KV 与 legacy 导入事务原语（移动端不编 native SQLite）
# - crates/smelt-pairing —— 桌面/移动端共用的配对码格式
# - crates/smelt-runtime-client —— smeltd wire 契约与协议客户端（桌面/移动端共用，能编进移动端）
# - crates/smelt-client-store —— 桌面客户端自己的库 client.sqlite3（外观、界面状态等）
# - crates/smelt-core   —— GUI 与守护共用的无 UI 逻辑（不许引 GPUI）
# - crates/smelt-git    —— Git 领域层（仓库发现/状态/diff/写操作，不含 UI）
# - crates/smeltd       —— 守护侧两个二进制（smeltd / smelt-notify）
# - crates/smelt        —— GUI 主程序（bin 名 smelt，与产品名统一）
[workspace]
members = [
    "crates/smelt-paths",
    "crates/smelt-sys",
    "crates/smelt-model",
    "crates/smelt-client",
    "crates/smelt-cli",
    "crates/smelt-event-protocol",
    "crates/smelt-event-bus",
    "crates/smelt-store",
    "crates/smelt-pairing",
    "crates/smelt-runtime-client",
    "crates/smelt-client-store",
    "crates/smelt-core",
    "crates/smelt-git",
    "crates/smeltd",
    "crates/smelt-ui",
    "crates/smelt-acp-view",
    "crates/smelt",
    "crates/smelt-iroh",
    "crates/smelt-mobile", # package 名是 smelt_mobile（cargokit 要求，见其 Cargo.toml）
]
resolver = "3"

# 版本号唯一真源，由 scripts/release.sh 改，不要手改（scripts/package-mac.sh 与 release CI 都
# grep 本文件的 '^version' 行做校验），各成员 version.workspace = true 继承。
[workspace.package]
version = "2026.1026.0-rc.1"
edition = "2024"
# 与 rust-toolchain.toml 一致。成员 crate 未一律 inherit，钉编译器靠 toolchain 文件。
rust-version = "1.97.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[patch.crates-io]
# gpui-shell 的标准库（LLRT 模块）依赖 crates.io 的 `rquickjs`，gpui-kit 在它自己的
# 工作区里把它 patch 成转发到 quickjs-jit 的兼容包，两边才是同一套类型和 VM。
# patch 不随依赖传递，所以这里照抄一份，rev 必须和各 crate 里的 gpui-kit 一致。
# 去掉会让 crates.io 的 rquickjs-core 和 quickjs-jit 同时进依赖图，gpui-shell 编不过
# （2026-10-16 在 8a83be7e 上验证）。上游官方仓库，不是 fork。
rquickjs = { git = "https://github.com/longbridge/gpui-kit", rev = "219fc1a9bdd6236c3a58f07c810e1b87079890c1" }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
needless_borrow = "warn"
unnecessary_to_owned = "warn"
unnecessary_sort_by = "warn"
collapsible_if = "warn"
cloned_ref_to_slice_refs = "warn"
redundant_clone = "warn"
# 正确性闸门：空 dbg/todo 不应进主线。存量 style 警告不在这里 deny，避免一次清不完。
dbg_macro = "deny"
todo = "deny"
# 手型光标只留给链接。路径是 gpui-pre 0.3.9 里 `Styled` 上由
# `cursor_style_methods!` 生成的方法（`gpui/src/styled.rs`，模块 `gpui::styled`）。
# macOS CI 不跑 clippy，真正挡住调用点的是 scripts/lint-pointer.sh。
disallowed_methods = "deny"

# proc-macro 和 build script 只在构建机上用，不发布，不用 strip。
# rustc 1.97 在 macOS 上用 `rust-objcopy --strip-debug` 实现默认的 strip=debuginfo，处理后的
# dylib 有时 LINKEDIT 字符串表不对齐（跟产物内容有关），macOS 27 的 dyld 拒绝加载，rustc 就报
# `can't find crate for rquickjs_macro`（2026-10-19 复现；系统 `strip -S` 处理同一文件没问题）。
[profile.release.build-override]
strip = false
