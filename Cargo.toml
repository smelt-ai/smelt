# 虚拟 workspace：所有代码住 crates/ 下，根不再有 package。
# - crates/smelt-store  —— 桌面 SQLite/KV 与 legacy 导入事务原语（移动端不编 native SQLite）
# - crates/smelt-pairing —— 桌面/移动端共用的配对码格式
# - crates/smelt-push  —— 手机推送的线上格式（运行时、手机 → 推送中继）
# - crates/smelt-push-relay —— 推送中继：持有 APNs 私钥，替 smeltd 转发推送
# - crates/smelt-version —— 编译时从 SMELT_VERSION 注入的版本号（见 scripts/version.sh）
# - crates/smelt-runtime-client —— smeltd wire 契约与协议客户端（桌面/移动端共用，能编进移动端）
# - crates/smelt-client-store —— 桌面客户端自己的库 client.sqlite3（外观、界面状态等）
# - crates/smelt-core   —— GUI 与守护共用的无 UI 逻辑（不许引 GPUI）
# - crates/smelt-git    —— Git 领域层（仓库发现/状态/diff/写操作，不含 UI）
# - crates/smeltd       —— 守护侧两个二进制（smeltd / smelt-notify）
# - crates/smelt        —— GUI 主程序（bin 名 smelt，与产品名统一）
[workspace]
members = [
    "crates/smelt-paths",
    "crates/smelt-version",
    "crates/smelt-sys",
    "crates/smelt-model",
    "crates/smelt-client",
    "crates/smelt-cli",
    "crates/smelt-event-protocol",
    "crates/smelt-event-bus",
    "crates/smelt-store",
    "crates/smelt-pairing",
    "crates/smelt-push",
    "crates/smelt-push-relay",
    "crates/smelt-runtime-client",
    "crates/smelt-client-store",
    "crates/smelt-core",
    "crates/smelt-git",
    "crates/smeltd",
    "crates/smelt-ui",
    "crates/smelt-buddy",
    "crates/smelt-plugin-api",
    "crates/smelt-nsh",
    "crates/plugins/agents",
    "crates/plugins/automations",
    "crates/plugins/capabilities",
    "crates/plugins/conversation",
    "crates/plugins/desktop",
    "crates/plugins/files",
    "crates/plugins/git",
    "crates/plugins/history",
    "crates/plugins/ide",
    "crates/plugins/language",
    "crates/plugins/layouts",
    "crates/plugins/machines",
    "crates/plugins/maintenance",
    "crates/plugins/notifications",
    "crates/plugins/resources",
    "crates/plugins/sessions",
    "crates/plugins/skills",
    "crates/plugins/terminal",
    "crates/plugins/themes",
    "crates/plugins/updater",
    "crates/smelt",
    "crates/smelt-iroh",
    "crates/smelt-mobile", # package 名是 smelt_mobile（cargokit 要求，见其 Cargo.toml）
]
# 打了补丁的第三方 crate 原样拷进来，不是工作区成员（见下面 [patch.crates-io]）。
exclude = ["vendor/quickjs-jit-runtime", "vendor/gpui-shell"]
resolver = "3"

# 版本号不写在这里：发版只打 tag，打包时从 tag 算出版本号，经 SMELT_VERSION 编进程序
# （crates/smelt-version，规则见 docs/release.md 的「版本号」）。这里固定 0.0.0，不要改。
[workspace.package]
version = "0.0.0"
edition = "2024"
# 与 rust-toolchain.toml 一致。成员 crate 未一律 inherit，钉编译器靠 toolchain 文件。
# gpui-pre-macos 0.3.10 起用了 1.98 才稳定的 `Option::map_or_default`。
rust-version = "1.98.0"
# 本仓库全部 crate 以 Apache-2.0 开源，只随 app 分发，不发 crates.io。
# 商业版私有仓里的闭源 crate 自己声明许可，不继承这里。
license = "Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
# 界面文案（docs/i18n.md）：插件、组件库、宿主各自带 locales/ui.yml。和 gpui-kit 同一套。
rust-i18n = "4.2"

[patch.crates-io]
# gpui-kit 0.8.1（611b55e331170ca375214d580b6c5409db858f83）起，gpui-shell 直接依赖
# crates.io 的 `quickjs-jit` / `quickjs-jit-stdlib` =0.14.1，工作区里不再有
# `rquickjs` 兼容门面。旧 patch 指向的包已从该修订删除。
# netdev 0.46.x（iroh → netwatch 引入）在 iOS 上调用了 iOS 不开放的 SystemConfiguration API
# （API_UNAVAILABLE(ios)，上架审核会拒），还用了 macOS 才有的 `in6_ifreq`。上游在 0.47.0 修了，
# 但 netwatch 还要求 ^0.46.3，所以钉修复所在的提交：它的版本号仍是 0.46.3，之后的 0.47.0 只改了版本号。
# netwatch 升到 netdev 0.47 后删掉这条，那时 cargo 会警告这条 patch 没用上。上游官方仓库，不是 fork。
# libc 的上限另见 crates/smelt-mobile/Cargo.toml。
netdev = { git = "https://github.com/shellrow/netdev", rev = "b3bfb0fb5595cd143bfa0b9f07d1ad6e0ef0c313" }

# quickjs-jit-runtime 0.14.2 的源码拷在 vendor/ 下，改动处标了 `SMELT:`。JIT 每次维护都把整张调用
# 反馈表拷一遍，Promise 每跑一个任务前后、回收器每回收一个函数各来一次完整维护，JS 一忙主线程
# 就耗在这里（插件重挂后第一次重建 20 多秒）：
# - 刷新候选不再各拷一份反馈：上游 longbridge/quickjs-jit#38 原样，未合。
# - 处理 Promise 任务和回收函数改走「到期才维护」：有编译完成或要回收的代码时照样跑全量。
# gpui-shell 原本钉 =0.14.1，NSH 钉 =0.14.2，两边一起升到 0.14.2，拷的是这一版。gpui-kit 升到带这几处修复的 quickjs-jit
# 时连同目录一起删掉；版本对不上时 cargo 会警告这条 patch 没用上。
quickjs-jit-runtime = { path = "vendor/quickjs-jit-runtime" }

# NSH 用我们的 fork：一个上游发版一条分支 `smelt/v<版本>`，内容是上游标签加每个改动一个提交，
# 不强推、不打标签。同步上游时开新分支重放这些提交，这里十个包一起换到同一个 rev。
nsh-base = { git = "https://github.com/smelt-ai/nsh", rev = "90d8f514b733a15e92e261fb394013c871f022a1" }
nsh-bundler = { git = "https://github.com/smelt-ai/nsh", rev = "90d8f514b733a15e92e261fb394013c871f022a1" }
nsh-core = { git = "https://github.com/smelt-ai/nsh", rev = "90d8f514b733a15e92e261fb394013c871f022a1" }
nsh-engine = { git = "https://github.com/smelt-ai/nsh", rev = "90d8f514b733a15e92e261fb394013c871f022a1" }
nsh-i18n = { git = "https://github.com/smelt-ai/nsh", rev = "90d8f514b733a15e92e261fb394013c871f022a1" }
nsh-js = { git = "https://github.com/smelt-ai/nsh", rev = "90d8f514b733a15e92e261fb394013c871f022a1" }
nsh-macros = { git = "https://github.com/smelt-ai/nsh", rev = "90d8f514b733a15e92e261fb394013c871f022a1" }
nsh-package = { git = "https://github.com/smelt-ai/nsh", rev = "90d8f514b733a15e92e261fb394013c871f022a1" }
nsh-platform-gpui = { git = "https://github.com/smelt-ai/nsh", rev = "90d8f514b733a15e92e261fb394013c871f022a1" }
nsh-updater = { git = "https://github.com/smelt-ai/nsh", rev = "90d8f514b733a15e92e261fb394013c871f022a1" }

# gpui-shell 拷在 vendor/ 下（上游 gpui-kit 同一修订），改动处标 `SMELT:`，以后搬到单独仓库。
# 升 gpui-kit 时先拿新修订的 crates/shell 覆盖，再按 `SMELT:` 把改动合回去。
[patch."https://github.com/longbridge/gpui-kit"]
gpui-shell = { path = "vendor/gpui-shell" }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
needless_borrow = "warn"
unnecessary_to_owned = "warn"
unnecessary_sort_by = "warn"
collapsible_if = "warn"
cloned_ref_to_slice_refs = "warn"
redundant_clone = "warn"
# `while let` / `match` / `if let` 条件里拿的锁守卫活到整个代码块结束：在里面等别的线程，
# 那边要拿同一把锁就互相卡住（补做写回曾因此每次等满 10 秒）。先取值放锁，再判断。
significant_drop_in_scrutinee = "warn"
# 正确性闸门：空 dbg/todo 不应进主线。存量 style 警告不在这里 deny，避免一次清不完。
dbg_macro = "deny"
todo = "deny"

# proc-macro 和 build script 只在构建机上用，不发布，不用 strip。
# rustc 1.97 在 macOS 上用 `rust-objcopy --strip-debug` 实现默认的 strip=debuginfo，处理后的
# dylib 有时 LINKEDIT 字符串表不对齐（跟产物内容有关），macOS 27 的 dyld 拒绝加载，rustc 就报
# `can't find crate for rquickjs_macro`（2026-10-19 复现；系统 `strip -S` 处理同一文件没问题）。
[profile.release.build-override]
strip = false
