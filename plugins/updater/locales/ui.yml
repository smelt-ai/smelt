    en: Retry Recovery
    zh-CN: 重试恢复
status:
  idle:
    en: Not checked yet
    zh-CN: 尚未检查更新
  idle_detail:
    en: Click “Check for Updates” to get the latest %{channel} installer
    zh-CN: 点击“检查更新”获取%{channel}的最新安装包
  checking:
    en: Checking for updates
    zh-CN: 正在检查更新
  checking_detail:
    en: Fetching the latest %{channel} version…
    zh-CN: 正在获取%{channel}的最新版本信息…
  up_to_date:
    en: Up to date
    zh-CN: 当前已是最新
  up_to_date_detail:
    en: No %{channel} updates available
    zh-CN: "%{channel}暂无可用更新"
  available:
    en: New version available
    zh-CN: 发现新版本
  available_detail:
    en: "%{channel} %{version} is out. Click “Download and Update” to get it"
    zh-CN: "%{channel}已发布 %{version}，点击“下载并更新”获取安装包"
  downloading:
    en: Downloading update
    zh-CN: 正在下载更新
  downloading_progress:
    en: Downloading update %{version}… %{percent}% (%{received} / %{total} MB)
    zh-CN: 正在下载更新包 %{version}… %{percent}%（%{received} / %{total} MB）
  downloading_bytes:
    en: Downloading update %{version}… (%{received} MB so far)
    zh-CN: 正在下载更新包 %{version}…（已下载 %{received} MB）
  installing:
    en: Preparing update
    zh-CN: 正在准备更新
  installing_detail:
    en: Verifying and preparing update %{version}…
    zh-CN: 正在校验并准备更新包 %{version}…
  applying:
    en: Starting the installer
    zh-CN: 正在启动更新安装器
  applying_detail:
    en: Starting the installer for update %{version}; the app quits only once it has started
    zh-CN: 正在为更新包 %{version} 启动安装程序；启动成功后 App 才会退出
  ready:
    en: Update ready
    zh-CN: 更新已准备就绪
  ready_detail:
    en: Update %{version} is downloaded. Click “Restart to Update” to apply it
    zh-CN: 更新包 %{version} 已下载完成，点击“立即重启更新”生效
  install_failed:
    en: Couldn't install the update
    zh-CN: 安装更新失败
  install_failed_detail:
    en: Update %{version} is still kept safely; retry, or check whether a newer version replaces it
    zh-CN: 更新包 %{version} 仍已安全保留；可直接重试，或检查是否已有替代版本
failure:
  check:
    en: Couldn't check for updates
    zh-CN: 检查更新失败
  check_detail:
    en: Can't reach the update service right now. Check your network and try again.
    zh-CN: 暂时无法连接更新服务，请检查网络后重试。
  download:
    en: Couldn't download the update
    zh-CN: 下载更新失败
  download_detail:
    en: Downloading or preparing the update failed. Check your network and free storage, then try again.
    zh-CN: 更新包下载或准备失败，请检查网络和可用存储空间后重试。
  recovery:
    en: Couldn't recover the update
    zh-CN: 恢复更新失败
  recovery_detail:
    en: The last update hasn't been recovered yet. Try again; the current installation won't be overwritten.
    zh-CN: 上次更新事务尚未恢复，请重试；现有安装不会被覆盖。
  location:
    en: Move to Applications first
    zh-CN: 需要先移到「应用程序」
  location_detail:
    en: Smelt was opened without being put in Applications, so macOS runs it from a read-only location and updates can't be installed. After moving it reopens automatically; background sessions aren't affected.
    zh-CN: Smelt 没放进「应用程序」就打开了，macOS 让它在只读位置运行，更新装不上。移过去后会自动重新打开，后台会话不受影响。
  not_installed:
    en: This Smelt can't update itself
    zh-CN: 这个 Smelt 不能自动更新
  not_installed_detail:
    en: It wasn't installed by the installer (a development build, for example). Download and run the installer from the download page, then you can update here.
    zh-CN: 它不是安装程序装的（比如开发构建）。去下载页下载安装程序装好后，就能在这里更新。
action:
  download:
    en: Download and Update
    zh-CN: 下载并更新
  restart:
    en: Restart to Update
    zh-CN: 立即重启更新
  retry_restart:
    en: Retry Restart to Update
    zh-CN: 重试重启更新
  move:
    en: Move to Applications and Reopen
    zh-CN: 移到「应用程序」并重新打开
  manual_download:
    en: Go to Download Page
    zh-CN: 去下载页
move:
  moving:
    en: Moving…
    zh-CN: 正在移动…
