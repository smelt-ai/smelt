    zh-CN: 已开启 · %{relay} · %{id}
  public_relay:
    en: public relay
    zh-CN: 公共 relay
  failed:
    en: "Couldn't turn on, retrying: %{error}"
    zh-CN: 开不起来，正在重试：%{error}
