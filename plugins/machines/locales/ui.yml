add:
  title:
    en: Add machine
    zh-CN: 添加机器
  description:
    en: Paste that machine's pairing code. Run smeltd pair on it, or create one under “Let other devices connect” there.
    zh-CN: 粘贴那台机器的配对串：在它上面执行 smeltd pair，或在它的「让其他设备连进来」里生成。
  empty:
    en: Paste that machine's pairing code first
    zh-CN: 先粘贴那台机器的配对串
  adding:
    en: Pairing…
    zh-CN: 正在配对…
  action:
    en: Add
    zh-CN: 添加
outgoing:
  title:
    en: Connect to other machines
    zh-CN: 连到其他机器
  description:
    en: Open projects and run sessions on other machines.
    zh-CN: 在别的机器上开项目、跑会话。
  empty:
    en: Not connected to any other machine yet.
    zh-CN: 还没有连到其他机器。
incoming:
  title:
    en: Let other devices connect
    zh-CN: 让其他设备连进来
  description:
    en: "Paired computers and phones can reach this machine over iroh: directly when possible, otherwise through a relay."
    zh-CN: 配对过的电脑和手机可以经 iroh 连这台机器：能直连就直连，连不上走 relay。
devices:
  title:
    en: Paired devices
    zh-CN: 已配对的设备
  empty:
    en: No devices paired yet.
    zh-CN: 还没有配对过设备。
  revoke:
    en: Revoke
    zh-CN: 撤销
pairing:
  title:
    en: Pair New Device
    zh-CN: 配对新设备
  begin:
    en: Pair New Device…
    zh-CN: 配对新设备…
  needs_access:
    en: Turn on remote access first
    zh-CN: 先开启远程访问
  warning:
    en: Pairing a device hands it your shell access on this machine.
    zh-CN: 配对一台设备，就是把你在这台机器上的 shell 权限交给它。
  generating:
    en: Creating a pairing code…
    zh-CN: 正在生成配对串…
  none:
    en: No pairing code yet.
    zh-CN: 还没有配对串。
  instructions:
    en: Scan with your phone, or copy the pairing code and paste it under “Connect to other machines” on another computer.
    zh-CN: 手机扫码；或复制配对串，在另一台电脑的「连到其他机器」里粘贴。
  copy:
    en: Copy pairing code
    zh-CN: 复制配对串
  copied:
    en: Copied
    zh-CN: 已复制
  expiry:
    en: Single use, valid for 10 minutes.
    zh-CN: 只能用一次，10 分钟内有效。
  regenerate:
    en: New Pairing Code
    zh-CN: 换一个配对串
  done:
    en: Done
    zh-CN: 完成
relay:
  custom:
    en: Custom relay
    zh-CN: 自建 relay
  custom_description:
    en: Leave empty to use n0's public relays. A domain, IP or URL here is the only relay used; https:// is assumed when no scheme is given.
    zh-CN: 留空用 n0 的公共 relay；填了域名、IP 或 URL 就只用它，省略协议时用 https://。
  title:
    en: Relay for %{name}
    zh-CN: "%{name} 的中继"
  save:
    en: Save
    zh-CN: 保存
  saving:
    en: Saving…
    zh-CN: 正在保存…
  placeholder:
    en: Leave empty for n0's public relay
    zh-CN: 留空用 n0 的公共 relay
  hint_online:
    en: That machine will switch to this relay, and this computer follows. Enter the domain, IP or URL of a self-hosted iroh relay; leave empty for n0's public relay.
    zh-CN: 那台机器会改用这个中继，这台电脑也跟着改。填自建 iroh relay 的域名、IP 或 URL；留空用 n0 的公共 relay。
  hint_offline:
    en: "That machine can't be reached now, so only this computer changes: that machine must already use the same relay (set with smeltd relay)."
    zh-CN: 那台机器现在连不上，只改这台电脑这边：那台机器要已经用 smeltd relay 改成同一个。
  failed:
    en: Couldn't change the relay
    zh-CN: 改中继失败
upgrade:
  action:
    en: Upgrade
    zh-CN: 升级
  tooltip:
    en: Upgrade this machine to v%{version}
    zh-CN: 请这台机器升到 v%{version}
  failed:
    en: Couldn't upgrade the runtime
    zh-CN: 升级运行时失败
remove:
  title:
    en: Remove this machine?
    zh-CN: 确定移除这台机器吗？
  action:
    en: Remove
    zh-CN: 移除
  description:
    en: This computer stops connecting to “%{name}”, and its projects and sessions leave the sidebar. Sessions on that machine keep running and come back after pairing again.
    zh-CN: 这台电脑不再连「%{name}」，侧栏里它的项目和会话会一起移走。那台机器上的会话照常运行，重新配对后还能回来。
  failed:
    en: Couldn't remove the machine
    zh-CN: 移除机器失败
rename:
  title:
    en: Rename Machine
    zh-CN: 重命名机器
  action:
    en: Rename
    zh-CN: 重命名
  description:
    en: This name shows in the sidebar and settings, on this computer only.
    zh-CN: 侧栏和设置里显示这个名字，只在这台电脑上生效。
  failed:
    en: Couldn't rename the machine
    zh-CN: 重命名机器失败
