access:
  title:
    en: Remote access
    zh-CN: 远程访问
  description:
    en: Sleep isn't prevented on battery power; it can only be reached while the computer is awake.
    zh-CN: 电池供电时不阻止休眠，只有电脑醒着才能连。
  off:
