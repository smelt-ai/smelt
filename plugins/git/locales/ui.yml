discard:
  all_menu:
    en: Discard all changes
    zh-CN: 丢弃全部更改
  all_title:
    en: Discard all working tree changes?
    zh-CN: 丢弃工作区全部更改？
  all_body:
    en: Tracked files go back to HEAD; unstaged and untracked new files are deleted.
    zh-CN: 已跟踪文件还原成 HEAD，未暂存 / 未跟踪的新文件会被删除。
  all_ok:
    en: Discard all
    zh-CN: 全部丢弃
  no_reflog:
    en: This doesn't go into the reflog and can't be recovered.
    zh-CN: 不进 reflog，找不回来。
  file_untracked_title:
    en: Delete this new file?
    zh-CN: 删除这个新文件？
  file_untracked_body:
    en: "%{path} was never tracked by git, so deleting it removes it for good."
    zh-CN: "%{path} 从未被 git 跟踪过，删了就是彻底删除。"
  file_untracked_ok:
    en: Delete file
    zh-CN: 删除文件
  file_title:
    en: Discard this file's changes?
    zh-CN: 丢弃这个文件的更改？
  file_body:
    en: "%{path} goes back to how it is in HEAD, including its staged part."
    zh-CN: "%{path} 会被还原成 HEAD 的样子，已暂存的部分一并还原。"
  file_ok:
    en: Discard changes
    zh-CN: 丢弃更改
  hunk_title:
    en: Discard this change?
    zh-CN: 丢弃这一块更改？
  hunk_body:
    en: "Change %{index} in %{path} goes back to how it was before."
    zh-CN: "%{path} 的第 %{index} 块更改会被还原成更改前的样子。"
  hunk_warning:
    en: This edits the working tree file directly, bypassing both the index and the reflog. Once discarded it can't be recovered.
    zh-CN: 直接改工作区文件，不进暂存区也不进 reflog——丢了就找不回来。
  hunk_ok:
    en: Discard change
    zh-CN: 丢弃这一块
  gone:
    en: "%{path} is no longer in the change list. Refresh and discard again."
    zh-CN: "%{path} 已不在改动列表里，请刷新后再丢弃。"
  not_loaded:
    en: The change list hasn't loaded yet. Refresh and discard again.
    zh-CN: 改动列表还没加载出来，请刷新后再丢弃。
hunk:
  stage:
    en: Stage hunk
    zh-CN: 暂存块
  unstage:
    en: Unstage hunk
    zh-CN: 取消暂存块
  discard:
    en: Discard hunk
    zh-CN: 丢弃块
  apply_failed:
    en: "Couldn't apply the hunk: %{error}\n(If this file is partly staged, the view mixes staged and unstaged changes and hunks won't line up; unstage the whole file with its checkbox and try again)"
    zh-CN: "按块操作失败：%{error}\n（这个文件若已部分暂存，当前视图混着暂存与未暂存的改动，按块操作会对不上号；先用勾选框整文件取消暂存再试）"
  unsupported:
    en: This diff can't be changed hunk by hunk (submodule / untracked file); use the whole-file checkbox
    zh-CN: 这个 diff 不支持按块操作（子模块 / 未跟踪文件），改用整文件的勾选框
