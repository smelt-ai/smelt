pull_request:
  not_repo:
    en: Not a Git repository
    zh-CN: 不是 Git 仓库
  not_pushed:
    en: This branch hasn't been pushed yet; push it before creating a PR
    zh-CN: 当前分支还没推送到远端，先推送再创建 PR
  no_default_branch:
    en: "The remote's default branch is unknown; try git remote set-head <remote> --auto"
    zh-CN: 不知道远端的默认分支，可以先执行 git remote set-head <远端> --auto
  on_default_branch:
    en: You're already on the default branch %{branch}; switch to a feature branch to create a PR
    zh-CN: 当前就在默认分支 %{branch} 上，切到功能分支再创建 PR
