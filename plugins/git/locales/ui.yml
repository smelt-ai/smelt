  delete_title:
    en: Delete this branch?
    zh-CN: 删除这个分支？
  delete_body:
    en: "%{branch} only deletes the local ref; working tree files aren't affected."
    zh-CN: "%{branch} 只删本地引用，工作区文件不受影响。"
  delete_warning:
    en: Git refuses if it has unmerged commits; it won't force-delete.
    zh-CN: 有未合并的提交时 git 会拒绝删除，不会强删。
  delete_remote_title:
    en: Delete this remote branch?
    zh-CN: 删除这个远端分支？
  delete_remote_body:
    en: "%{branch} is deleted from the remote; others lose it locally after they pull."
    zh-CN: "%{branch} 会从远端仓库删除，其他人拉取后本地也会跟着消失。"
  delete_remote_warning:
    en: This affects every collaborator; make sure nobody is using it.
    zh-CN: 影响所有协作者，删之前确认没人在用。
