_version: 2
cleanup:
  title:
    en: "Clean Up"
    zh-CN: "清理残留"
  row:
    en: "Leftover files"
    zh-CN: "历史残留"
  scanning:
    en: "Checking ~/.smelt…"
    zh-CN: "正在检查 ~/.smelt…"
  scan_failed:
    en: "Couldn't read ~/.smelt: %{error}"
    zh-CN: "读不了 ~/.smelt：%{error}"
  empty:
    en: "Everything in ~/.smelt is in use"
    zh-CN: "~/.smelt 里都是在用的文件"
  summary:
    en: "Files in ~/.smelt that Smelt no longer uses: %{count} items, %{size}"
    zh-CN: "~/.smelt 里已经不再使用的文件：%{count} 项，共 %{size}"
  action:
    en: "Clean Up…"
    zh-CN: "清理…"
  remove_failed:
    en: "Couldn't delete: %{error}"
    zh-CN: "删不掉：%{error}"
  confirm:
    title:
      en: "Delete these %{count} items?"
      zh-CN: "删除这 %{count} 项？"
    description:
      en: "Frees %{size}. They are deleted for good, not moved to the Trash."
      zh-CN: "腾出 %{size}。直接删除，不进废纸篓，删了找不回来。"
    action:
      en: "Delete"
      zh-CN: "删除"
    cancel:
      en: "Cancel"
      zh-CN: "取消"
cli:
  title:
    en: "Command Line"
    zh-CN: "命令行"
  row:
    en: "smelt command in Terminal"
    zh-CN: "终端里的 smelt 命令"
  status:
    unknown:
      en: "Not checked yet"
      zh-CN: "还没检查"
    installed:
      en: "Installed: %{link} points to this app"
      zh-CN: "已装好：%{link} 指向这个 App"
    missing:
      en: "Puts a smelt in /usr/local/bin that points to this app, so you can type smelt agent list right in Terminal. Usually asks for an administrator password once."
      zh-CN: "在 /usr/local/bin 放一个指向这个 App 的 smelt，终端里就能直接敲 smelt agent list。一般要输一次管理员密码"
    stale:
      en: "%{link} doesn't point to this app. Install again to switch it over."
      zh-CN: "%{link} 指向的不是这个 App，重新装一次就换过来"
    taken:
      en: "%{link} is another program and was left alone"
      zh-CN: "%{link} 已经是别的程序，没有动它"
  install:
    action:
      en: "Install"
      zh-CN: "安装"
    again:
      en: "Reinstall"
      zh-CN: "重新安装"
    running:
      en: "Installing…"
      zh-CN: "安装中…"
    done:
      en: "The smelt command is installed. New Terminal windows can use it."
      zh-CN: "已装好 smelt 命令，新开的终端里就能用"
    failed:
      en: "Couldn't install the smelt command: %{error}"
      zh-CN: "装 smelt 命令失败：%{error}"
    cancelled:
      en: "Authorization was cancelled"
      zh-CN: "已取消授权"
    no_home:
      en: "Can't find $HOME"
      zh-CN: "找不到 $HOME"
    link_failed:
      en: "Couldn't place ~/.smelt/bin/smelt: %{error}"
      zh-CN: "放 ~/.smelt/bin/smelt 失败：%{error}"
    osascript_failed:
      en: "Couldn't run osascript: %{error}"
      zh-CN: "无法执行 osascript：%{error}"
notify:
  done:
    en: "Done"
    zh-CN: "完成"
  error:
    en: "Error"
    zh-CN: "错误"
