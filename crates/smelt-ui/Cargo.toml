# 共享 GPUI UI 基建：主 GUI 和 acp-view 渲染层都要用的一批组件/工具
# （语义色板、markdown+mermaid 渲染、@/ 补全）。
# 允许引 GPUI（跟 smelt-core 的边界不同）——这里不是 GUI 无关的纯逻辑，而是
# 「不属于哪个具体页面、被多处复用」的 UI 层基建。
# 只放界面：不依赖客户端库和运行时客户端，跨功能共享的状态在 smelt-app-state。
[package]
name = "smelt-ui"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
smelt-model = { path = "../smelt-model" }
# 异步里等全局状态到位（global_wait）。
smol = "2"
serde_json = "1"
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "0ebd729f4441ee57d630bcde4a3743bd1284edd6" }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "0ebd729f4441ee57d630bcde4a3743bd1284edd6", features = ["tree-sitter-languages"] }
# mermaid 代码块画图，见 markdown_mermaid.rs。版本锁死。
# 不开 layout-elk：它带进 EPL-2.0 的 merman-elk-layered，分发二进制要随附源码和声明；
# 默认布局也会从 dagre 换成 ELK（见 markdown_mermaid.rs 文件头）。不走默认 features /
# complete-svg：那几条还会打开 math（RaTeX）。architecture 图要 cytoscape，所以保留
# layout-cytoscape。
merman = { version = "=0.9.2", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
# 类图测宽和单测解析都用 GPUI 同一份 usvg 0.46（gpui-pre 0.3.11 经 resvg 打开
# text/system-fonts/memmap-fonts）。gpui 不把 fontdb 公开出去，只能直接依赖这个版本，
# cargo 会和 gpui 合成同一份。
usvg = "=0.46.0"
# usvg 0.46 已经依赖 rustybuzz 0.20.1，显式依赖是为了用 Face 量 advance。
rustybuzz = "=0.20.1"
sha2 = "0.11"
hex = "0.4"
# 对话里 Markdown 文件链接点击时转成 smelt-file URL，见 markdown_links.rs。
url = "2"
# 图片显示统一抽象（image.rs）：ACP 图片解码 + 降采样。与 smelt 主 crate 同
# 版本（0.25、默认关全格式），features 保持 png/jpeg/gif/webp——Bmp/Tiff 等
# 格式当前调用方不会遇到，不为此扩大解码面。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }

# 截断宽度的问题只在真实字形下才有，测试默认的 Noop 字体系统是等宽假字。特性与
# crates/smelt 里 gpui_platform 开的一致：同一套字体后端，且免装 Metal 工具链。
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.11", features = ["font-kit", "runtime_shaders"] }
