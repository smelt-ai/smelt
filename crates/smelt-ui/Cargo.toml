# 共享 GPUI UI 基建：主 GUI 和 acp-view 渲染层都要用的一批组件/工具
# （语义色板、markdown+mermaid 渲染、@/ 补全）。
# 允许引 GPUI（跟 smelt-core 的边界不同）——这里不是 GUI 无关的纯逻辑，而是
# 「不属于哪个具体页面、被多处复用」的 UI 层基建。
# 只放界面：不依赖客户端库和运行时客户端，跨功能共享的状态在 smelt-app-state。
[package]
name = "smelt-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-model = { path = "../smelt-model" }
# 异步里等全局状态到位（global_wait）。
smol = "2"
serde_json = "1"
gpui = { package = "gpui-fast", version = "=0.1.17" }
# 组件的行为（焦点、键盘、无障碍、对话框层、输入框、富文本）都取 gpui-base，外观自己画。
# 不依赖 gpui-component：它的外观读它自己的 `Theme`，和 smelt 的主题是两个权威。
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "4373234ff46df3a3227972788a41dc6603d352ce", features = ["gpui-fast"] }
# mermaid 代码块画图，见 markdown_mermaid.rs。版本锁死。
# 不开 layout-elk：它带进 EPL-2.0 的 merman-elk-layered，分发二进制要随附源码和声明；
# 默认布局也会从 dagre 换成 ELK（见 markdown_mermaid.rs 文件头）。不走默认 features /
# complete-svg：那几条还会打开 math（RaTeX）。architecture 图要 cytoscape，所以保留
# layout-cytoscape。
merman = { version = "=0.9.2", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
# 类图测宽和单测解析都用 GPUI 同一份 usvg 0.46（gpui-pre 0.3.12 经 resvg 打开
# text/system-fonts/memmap-fonts）。gpui 不把 fontdb 公开出去，只能直接依赖这个版本，
# cargo 会和 gpui 合成同一份。
usvg = "=0.46.0"
# usvg 0.46 已经依赖 rustybuzz 0.20.1，显式依赖是为了用 Face 量 advance。
rustybuzz = "=0.20.1"
sha2 = "0.11"
hex = "0.4"
# 图片显示统一抽象（image.rs）：ACP 图片解码 + 降采样。与 smelt 主 crate 同
# 版本（0.25、默认关全格式），features 保持 png/jpeg/gif/webp——Bmp/Tiff 等
# 格式当前调用方不会遇到，不为此扩大解码面。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# 代码语法高亮（syntax/）：文件页的代码编辑器、Markdown 代码块、差异视图共用一套。
tree-sitter = "0.27.2"
# 语法包导出的语言入口类型（`LanguageFn`），tree-sitter 本身不再导出它。
tree-sitter-language = "0.1"
# 编辑器的语言服务里 Python 的缩进规则（syntax/editing.rs）。
regex = "1"
# 差异视图（diff/）：行内改动按词或字比对、按字素切分、按显示宽度估列宽，行内小数组。
similar = { version = "2.7", features = ["unicode"] }
unicode-segmentation = "1"
unicode-width = "0.2"
smallvec = "1"
tree-sitter-astro-next = "0.1.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.1"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cmake = "0.7.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-diff = "0.1.0"
tree-sitter-elixir = "0.3"
tree-sitter-embedded-template = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-jsdoc = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-sg = "0.4.0"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.1"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.0"
tree-sitter-scala = "0.26.13"
tree-sitter-sequel = "0.3.8"
tree-sitter-svelte-next = "0.1.1"
tree-sitter-swift = "0.7.0"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.1"
tree-sitter-zig = "1.1.2"
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true

[dev-dependencies]
gpui = { package = "gpui-fast", version = "=0.1.17", features = ["test-support"] }
# 截断宽度的问题只在真实字形下才有，测试默认的 Noop 字体系统是等宽假字。特性与
# crates/smelt 里 gpui_platform 开的一致：同一套字体后端，且免装 Metal 工具链。
# test-support 打开离屏 Metal 渲染（MetalHeadlessRenderer），组件快照用它出图。
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { package = "gpui-fast-apple", version = "=0.1.17", features = ["font-kit", "runtime_shaders", "test-support"] }
