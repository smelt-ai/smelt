# 共享 GPUI UI 基建：主 GUI 和未来的 acp-view 渲染层都要用的一批组件/工具
# （语义色板、markdown+mermaid 渲染、@/ 补全、ACP agent UI 偏好数据模型）。
# 允许引 GPUI（跟 smelt-core 的边界不同）——这里不是 GUI 无关的纯逻辑，而是
# 「不属于哪个具体页面、被多处复用」的 UI 层基建。
[package]
name = "smelt-ui"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
smelt-sys = { path = "../smelt-sys" }
smelt-model = { path = "../smelt-model" }
smelt-client = { path = "../smelt-client" }
smelt-runtime-client = { path = "../smelt-runtime-client" }
smelt-client-store = { path = "../smelt-client-store" }
# 智能体配置的修改按顺序排队提交给运行时（agent_host_state）。
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "af456ddb2fe7bc57f040bb94064135cf353488d6" }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "af456ddb2fe7bc57f040bb94064135cf353488d6", features = ["tree-sitter-languages"] }
# mermaid 代码块画图，见 markdown_mermaid.rs。版本锁死。
# 默认 features 是 complete-svg-elk，会把 EPL-2.0 的 ELK 编进来，这里关掉。
# architecture 图要 cytoscape 布局。complete-svg 还会打开 math（RaTeX），
# 当前图种用不到，所以只开 svg + layout-cytoscape，不单开 math。
merman = { version = "=0.9.1", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
# 类图测宽和单测解析都用 GPUI 同一份 usvg 0.46（gpui-pre 0.3.9 经 resvg 打开
# text/system-fonts/memmap-fonts）。gpui 不把 fontdb 公开出去，只能直接依赖这个版本，
# cargo 会和 gpui 合成同一份。
usvg = "=0.46.0"
# usvg 0.46 已经依赖 rustybuzz 0.20.1，显式依赖是为了用 Face 量 advance。
rustybuzz = "=0.20.1"
sha2 = "0.10"
# 图片显示统一抽象（image.rs）：ACP 图片解码 + 降采样。与 smelt 主 crate 同
# 版本（0.25、默认关全格式），features 保持 png/jpeg/gif/webp——Bmp/Tiff 等
# 格式当前调用方不会遇到，不为此扩大解码面。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
# 测试要用运行时的归约器和存储层校验格式；正式代码不依赖它们（设计文档 P1）。
smelt-core = { path = "../smelt-core" }
smelt-store = { path = "../smelt-store" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
