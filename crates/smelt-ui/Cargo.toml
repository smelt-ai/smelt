# 共享 GPUI UI 基建：主 GUI 和未来的 acp-view 渲染层都要用的一批组件/工具
# （语义色板、markdown+mermaid 渲染、@/ 补全、ACP agent UI 偏好数据模型）。
# 允许引 GPUI（跟 smelt-core 的边界不同）——这里不是 GUI 无关的纯逻辑，而是
# 「不属于哪个具体页面、被多处复用」的 UI 层基建。
[package]
name = "smelt-ui"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
smelt-core = { path = "../smelt-core" }
smelt-store = { path = "../smelt-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5" }
gpui-base = { git = "https://github.com/zzfn/gpui-component", rev = "0ba9d922e335185e654a6c0ac643f5f1a1e9370d" }
gpui-component = { git = "https://github.com/zzfn/gpui-component", rev = "0ba9d922e335185e654a6c0ac643f5f1a1e9370d", features = ["tree-sitter-languages"] }
scheduler = { git = "https://github.com/zed-industries/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5" }
# mermaid 代码块画图，见 markdown_mermaid.rs 文件头注释；版本锁定理由同处。
rusty-mermaid = { version = "=0.2.0", features = ["svg"] }
sha2 = "0.10"
# 图片显示统一抽象（image.rs）：ACP 图片解码 + 降采样。与 smelt 主 crate 同
# 版本（0.25、默认关全格式），features 保持 png/jpeg/gif/webp——Bmp/Tiff 等
# 格式当前调用方不会遇到，不为此扩大解码面。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5", features = ["test-support"] }
