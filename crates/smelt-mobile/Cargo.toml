[package]
name = "smelt_mobile"
version = "0.1.0"
edition = "2024"
description = "Smelt mobile FFI layer for Flutter"

[lib]
# 用下划线：cargokit 直接拿 package.name 去拼 `lib<name>.a` 找产物，
# 不做 cargo 那套 `-`→`_` 转换。用连字符会让它找不到静态库、
# 报 "Unable to find bundle for dynamic library"。
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Flutter Rust Bridge
flutter_rust_bridge = "=2.12.0"

# 复用 smelt-core
smelt-core = { path = "../smelt-core" }

# iroh 隧道：直接复用桌面侧的 ALPN 与 endpoint 构建，避免两端各写一份而悄悄连不上
smelt-iroh = { path = "../smelt-iroh" }
iroh = "1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "io-util"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (tweetnacl compatible)
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
md5 = "0.7"
once_cell = "1.19"

# WebSocket
# WebSocket。
#
# TLS 走 rustls + 内置的 webpki 根证书，而不是 native-tls：native-tls 在 Apple 上
# 用 Security.framework，到 Android 上却退化成 openssl-sys，交叉编译时要一整套
# Android 版 OpenSSL，NDK 里没有，构建直接失败。rustls 是纯 Rust，各平台一致；
# 根证书打进二进制也省掉了「Android 各厂商 ROM 的系统证书目录在哪」这个问题。
# 用 ring 而不是 aws-lc：iroh 已经把 ring 拉进依赖树了，换一个 provider 会让
# rustls 的进程默认 provider 出现两个候选，运行时首次建连即 panic。
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
log = "0.4"

# Android 上 log crate 没有默认后端，不接一个的话 log::info! 全部静默丢弃，
# 而 logcat 是排查真机问题的唯一手段。Apple 侧不需要（暂时也没接），所以按
# target 条件依赖，避免给 iOS 构建平白拉进 JNI 相关的代码。
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[build-dependencies]
# flutter_rust_bridge_codegen = "2.12"  # Use CLI instead
