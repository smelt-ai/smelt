[package]
name = "smelt_mobile"
version = "0.1.0"
edition = "2021"
description = "Smelt mobile FFI layer for Flutter"

[lib]
# 用下划线：cargokit 直接拿 package.name 去拼 `lib<name>.a` 找产物，
# 不做 cargo 那套 `-`→`_` 转换。用连字符会让它找不到静态库、
# 报 "Unable to find bundle for dynamic library"。
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Flutter Rust Bridge
flutter_rust_bridge = "=2.12.0"

# 复用 smelt-core
smelt-core = { path = "../smelt-core" }

# iroh 隧道：直接复用桌面侧的 ALPN 与 endpoint 构建，避免两端各写一份而悄悄连不上
smelt-iroh = { path = "../smelt-iroh" }
iroh = "1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "io-util"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (tweetnacl compatible)
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
md5 = "0.7"
once_cell = "1.19"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
log = "0.4"

[build-dependencies]
# flutter_rust_bridge_codegen = "2.12"  # Use CLI instead
