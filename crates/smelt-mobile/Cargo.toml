[package]
name = "smelt-mobile"
version = "0.1.0"
edition = "2021"
description = "Smelt mobile FFI layer for Flutter"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Flutter Rust Bridge
flutter_rust_bridge = "=2.12.0"

# 复用 smelt-core
smelt-core = { path = "../smelt-core" }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (tweetnacl compatible)
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
md5 = "0.7"
once_cell = "1.19"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
log = "0.4"

[build-dependencies]
# flutter_rust_bridge_codegen = "2.12"  # Use CLI instead
