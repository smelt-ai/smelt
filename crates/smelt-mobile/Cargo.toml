[package]
name = "smelt_mobile"
version = "0.1.0"
edition = "2024"
description = "Smelt mobile FFI layer for Flutter"

[lib]
# 用下划线：cargokit 直接拿 package.name 去拼 `lib<name>.a` 找产物，
# 不做 cargo 那套 `-`→`_` 转换。用连字符会让它找不到静态库、
# 报 "Unable to find bundle for dynamic library"。
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Flutter Rust Bridge
flutter_rust_bridge = "=2.12.0"

# iroh 隧道：直接复用桌面侧的 ALPN 与 endpoint 构建，避免两端各写一份而悄悄连不上
smelt-iroh = { path = "../smelt-iroh" }
iroh = "1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "io-util"] }
once_cell = "1.19"

# Error handling
anyhow = "1"

# Logging
log = "0.4"

# Android 上 log crate 没有默认后端，不接一个的话 log::info! 全部静默丢弃，
# 而 logcat 是排查真机问题的唯一手段。Apple 侧不需要（暂时也没接），所以按
# target 条件依赖，避免给 iOS 构建平白拉进 JNI 相关的代码。
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[build-dependencies]
# flutter_rust_bridge_codegen = "2.12"  # Use CLI instead
