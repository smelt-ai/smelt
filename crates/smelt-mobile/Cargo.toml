[package]
name = "smelt_mobile"
version = "0.1.0"
edition = "2024"
description = "Smelt mobile FFI layer for Flutter"

[lib]
# 用下划线：cargokit 直接拿 package.name 去拼 `lib<name>.a` 找产物，
# 不做 cargo 那套 `-`→`_` 转换。用连字符会让它找不到静态库、
# 报 "Unable to find bundle for dynamic library"。
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Flutter Rust Bridge
flutter_rust_bridge = "=2.12.0"

# 与桌面共用的协议客户端、iroh 传输、配对串格式与 Control API 类型。
smelt-iroh = { path = "../smelt-iroh" }
smelt-runtime-client = { path = "../smelt-runtime-client" }
smelt-model = { path = "../smelt-model" }
smelt-pairing = { path = "../smelt-pairing" }
smelt-event-protocol = { path = "../smelt-event-protocol" }
# 只为在设备身份里存 `iroh::SecretKey`，版本跟 smelt-iroh 走同一个（>=1.1.0）。
iroh = "1.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# 离线缓存（会话列表、最近对话的尾部）。业务持久化统一用 SQLite；bundled 自带源码，
# iOS / Android 都能编，不依赖系统库版本。
rusqlite = { version = "0.37", features = ["bundled"] }

# Logging
log = "0.4"

# Android 上 log crate 没有默认后端，不接一个的话 log::info! 全部静默丢弃，
# 而 logcat 是排查真机问题的唯一手段。Apple 侧不需要（暂时也没接），所以按
# target 条件依赖，避免给 iOS 构建平白拉进 JNI 相关的代码。
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

# 不直接用 libc，只给它封顶：libc 0.2.190 起 `in6_ifreq`、`RTM_GET2`、`RTF_IFSCOPE` 等只在
# macOS 上导出，netwatch 0.19/0.20（iroh 引入）在所有 Apple 平台都用它们，iOS 上编不过。
# netdev 的同类问题已由根 Cargo.toml 的 patch 解决，剩下的是 netwatch，上游 main 也还没修。
# 封顶写在这里，`cargo update` 就不会把 lockfile 里的 libc 又升上去；dependabot 也忽略了
# 这个范围（.github/dependabot.yml），它曾经直接把上限改高（#121）。
# netwatch 在 iOS 上能用新 libc 编过后（https://github.com/n0-computer/net-tools/issues/261）
# 删掉这段和 dependabot 的忽略。
[target.'cfg(target_os = "ios")'.dependencies]
libc = ">=0.2, <0.2.190"
