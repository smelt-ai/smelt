# 内置插件「用其他应用打开」：探测本机的编辑器 / IDE 和它们的图标，登记进项目右键菜单，
# 点了用它打开项目目录；系统文件管理器也在这一组里。只依赖插件接口，宿主里没有它的类型。
[package]
name = "smelt-ide"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
# 菜单里没有应用图标时的线性图标。
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit", rev = "0ebd729f4441ee57d630bcde4a3743bd1284edd6" }

# 用 Launch Services 按名字找 `.app`、读应用包里的图标。
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
