# 内置插件「用其他应用打开」：探测本机的编辑器 / IDE 和它们的图标，登记进项目右键菜单，
# 点了用它打开项目目录；系统文件管理器也在这一组里。只依赖插件接口，宿主里没有它的类型。
[package]
name = "smelt-ide"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-fast", version = "=0.1.17" }
serde = { version = "1", features = ["derive"] }

# 用 Launch Services 按名字找 `.app`、读应用包里的图标。
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
