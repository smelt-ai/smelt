# 内置插件「维护」：这台电脑上的杂务。设置里清理 `~/.smelt` 下没登记的残留；macOS 上
# 管终端里的 `smelt` 命令（设置「系统 → 命令行」）。不经运行时；只依赖插件接口。
[package]
name = "smelt-maintenance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-fast", version = "=0.1.17" }
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true
