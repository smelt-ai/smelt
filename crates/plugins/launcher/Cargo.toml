# 内置插件「启动栏」：侧栏顶上的新对话和入口列表（哪页布局都没摆的视图），侧栏底下的设置。
# 本仓库里只依赖插件接口，宿主里没有它的类型。
[package]
name = "smelt-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
# 完整的 lucide 图标表：新对话、设置的图标。
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit", rev = "0ebd729f4441ee57d630bcde4a3743bd1284edd6" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
