# 内置插件「变更」：当前项目各仓库的改动、暂存、提交、推送、分支和提交历史。git 命令由
# 项目所在机器的运行时执行。只依赖插件接口，宿主里没有它的类型。
#
# 包名不叫 smelt-git：那是 git 领域层（运行时用）。
[package]
name = "smelt-git-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-fast", version = "=0.1.17" }
# 面板组的分隔条换成发丝（见 lib.rs 的 h_resizable）。
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "4373234ff46df3a3227972788a41dc6603d352ce", features = ["gpui-fast"] }
# 日志页的提交时间。
chrono = "0.4"
# 照抄别的插件的约定（命令参数、菜单上下文）要按同样的 JSON 形状收发。
serde = { version = "1", features = ["derive"] }
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true

[dev-dependencies]
gpui = { package = "gpui-fast", version = "=0.1.17", features = ["test-support"] }
