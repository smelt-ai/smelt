    en: "Settings cleared"
    zh-CN: "已清空配置"
  description:
    en: "Attaches memories relevant to each question to the conversation. Keyword search is always on; the rerank model and vector search are optional and fall back automatically when unavailable."
    zh-CN: "按问题把相关的记忆附到对话里。关键词检索总是开着；重排模型和向量检索都可选，不可用时自动退回。"
  form_description:
    en: "Enter an OpenAI-compatible /embeddings service (local ones like Ollama work too, e.g. http://localhost:11434/v1). Without one, or when it's unavailable, only keyword search + model reranking is used."
    zh-CN: "填一个 OpenAI 兼容的 /embeddings 服务（含 Ollama 等本地服务，如 http://localhost:11434/v1）。没配或服务不可用时，只用关键词 + 模型重排。"
  key_cleared:
    en: "Key cleared"
    zh-CN: "已清除密钥"
  key_empty:
    en: "Optional; local services usually don't need one"
    zh-CN: "可选，本地服务一般不需要"
  key_hint:
    en: "Leave the API key empty to keep it unchanged; a saved key is never shown."
    zh-CN: "API Key 留空表示保持不变；已存的密钥不会显示。"
  key_set:
    en: "Set"
    zh-CN: "已设置"
  loading:
    en: "Loading…"
    zh-CN: "正在读取…"
  model:
    en: "Model"
    zh-CN: "模型"
  model_placeholder:
    en: "e.g. bge-m3"
    zh-CN: "如 bge-m3"
  need_both:
    en: "Fill in both the service address and the model, or leave both empty to skip vector search"
    zh-CN: "服务地址和模型需要同时填写；都留空表示不用向量检索"
  need_both_to_test:
    en: "Fill in the service address and the model before testing"
    zh-CN: "填好服务地址和模型再测试"
  rerank_auto:
    en: "Automatic (the cheapest model from the current conversation's provider)"
    zh-CN: "自动（当前对话所用提供方里最便宜的）"
  rerank_description:
    en: "On a session's first turn, after compaction and on memory_search, this model picks the relevant memories from the candidates. A small, fast model is enough; if the chosen model is unavailable, that turn uses search results only and never switches to another model. Reasoning is set to the lowest level automatically."
    zh-CN: "会话第一轮、压缩之后和 memory_search 时，用它从候选里挑相关的记忆。选小而快的模型即可；指定的模型不可用时这一轮只用检索结果，不会换成别的模型。推理自动压到最低档。"
  rerank_title:
    en: "Rerank Model"
    zh-CN: "重排模型"
  rerank_updated:
    en: "Rerank model updated"
    zh-CN: "已更新重排模型"
