memory:
  api_key:
    en: "API Key (optional)"
    zh-CN: "API Key（可选）"
  base_url:
    en: "Service Address"
    zh-CN: "服务地址"
  base_url_placeholder:
    en: "e.g. http://localhost:11434/v1"
    zh-CN: "如 http://localhost:11434/v1"
