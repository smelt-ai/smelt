# 内置插件「智能体」：每台机器上的智能体定义（指令、引擎与模型、Pi 能力、上下文、记忆），
# 和跟智能体开新对话的入口。
# 只依赖插件接口和 gpui-base，宿主里没有它的类型（见 docs/app-plugins.md）。
[package]
name = "smelt-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-fast", version = "=0.1.17" }
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "4373234ff46df3a3227972788a41dc6603d352ce", features = ["gpui-fast"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
# 照抄别的插件的约定（命令参数、菜单上下文）要按同样的 JSON 形状收发。
serde = { version = "1", features = ["derive"] }
# 额度刷新循环的点击队列、和定时器赛跑；改配置的队列交回结果。
smol = "2"
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true

[dev-dependencies]
gpui = { package = "gpui-fast", version = "=0.1.17", features = ["test-support"] }
