# 内置插件「历史」：列出当前项目下各家 agent 存的历史会话，看内容、续接、交接给别家、
# 改名、删除。只依赖插件接口和 gpui-base，宿主里没有它的类型（见 docs/app-plugins.md）。
[package]
name = "smelt-history"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "0ebd729f4441ee57d630bcde4a3743bd1284edd6" }
# 照抄别的插件的约定（命令参数、菜单上下文）要按同样的 JSON 形状收发。
serde = { version = "1", features = ["derive"] }
