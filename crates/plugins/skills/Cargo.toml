# 内置插件「技能」：右栏的技能面板。列出用户级和当前项目的技能，看各家 agent 能不能用，
# 补兼容链接、改作用范围、导入、删除、处理同名副本、迁移旧位置。读写的是这台电脑的磁盘，
# 只认本机项目。只依赖插件接口，宿主里没有它的类型。
[package]
name = "smelt-skills"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true
# 用户主目录：用户级技能和各家 agent 的配置目录都在它下面。
dirs = "5"

# 导入时原子交换新旧两个目录（macOS renamex_np / Linux renameat2）。
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
