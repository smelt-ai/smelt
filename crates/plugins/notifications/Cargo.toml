# 内置插件「通知」：会话提醒的系统通知（发、撤）、通知设置页、菜单栏的计数和会话菜单、
# Dock 角标。提醒读运行时的 `attention.changed`，只依赖插件接口，宿主里没有它的类型
# （见 docs/app-plugins.md）。
[package]
name = "smelt-notifications"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-fast", version = "=0.1.17" }
# 照抄别的插件的约定（命令参数、菜单上下文）要按同样的 JSON 形状收发。
serde = { version = "1", features = ["derive"] }
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true

[dev-dependencies]
tempfile = "3"
