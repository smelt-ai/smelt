# 内置插件「通知」：会话提醒的系统通知（发、撤）、通知设置页、菜单栏的计数和会话菜单、
# Dock 角标。提醒读运行时的 `attention.changed`，只依赖插件接口和 gpui 组件库，宿主里
# 没有它的类型（见 docs/app-plugins.md）。
[package]
name = "smelt-notifications"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "0ebd729f4441ee57d630bcde4a3743bd1284edd6" }

[dev-dependencies]
tempfile = "3"
