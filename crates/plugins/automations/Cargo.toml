# 内置插件「自动化」：每台机器上的定时、间隔、webhook 任务，它们的运行记录和完成提醒。
# 只依赖插件接口和 gpui-base，宿主里没有它的类型（见 docs/app-plugins.md）。
[package]
name = "smelt-automations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "69dab1accf3570bf3c0974bc32241bb031cc0b1b" }
# 运行时间、下次运行按本地时区显示。
chrono = "0.4"
# 打开页面的参数、通知点击带的命令参数。
serde = { version = "1", features = ["derive"] }
# 新建自动化的 id、编辑器实例。
uuid = { version = "1", features = ["v4"] }
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true

[dev-dependencies]
tempfile = "3"
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
