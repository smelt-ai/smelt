template:
  add:
    en: "Add"
    zh-CN: "添加"
  all:
    en: "All"
    zh-CN: "全部"
  competitor_watch:
    description:
      en: "Sum up this week's product, pricing and public news from the companies you follow."
      zh-CN: "汇总关注对象本周的产品、定价和公开动态。"
    name:
      en: "Competitor Watch"
      zh-CN: "竞品观察"
    prompt:
      en: "Sum up this week's product, pricing and public news from [products or companies to follow]. For each item, give the source, what changed, and what it means for us."
      zh-CN: "汇总「填写关注的产品或公司」本周的产品、定价和公开动态。每条写清来源、变化、对我们的含义。"
  daily_planner:
    description:
      en: "Turn your to-do file into doable time blocks and quick wins for today."
      zh-CN: "按你的待办文件排出今天可执行的时间块和快赢项。"
    name:
      en: "Daily Plan"
      zh-CN: "每日计划"
    prompt:
      en: "Read the to-do file [file path] and lay out doable time blocks for today. Give each block a goal and a definition of done; quick wins first, then deep work."
      zh-CN: "读取待办文件「填写文件路径」，排出今天可执行的时间块。每块写目标和完成标准，先快赢再深水区。"
  dependency_check:
    description:
      en: "Report only outdated or high-risk dependencies, with the smallest fix for each."
      zh-CN: "只报告过期或高风险依赖，并给出最小修复建议。"
    name:
      en: "Dependency Checkup"
      zh-CN: "依赖体检"
    prompt:
      en: "Check whether the dependencies of the repository [repository path] are outdated or have known high-risk issues. Report only what needs attention, with the smallest fix for each."
      zh-CN: "检查仓库「填写仓库路径」的依赖是否过期或有已知高风险问题。只报告需要处理的项，并给出最小修复建议。"
  engineering:
    en: "Engineering"
    zh-CN: "工程"
  morning_brief:
    description:
      en: "Start the day with a few bullet points: repository activity and the three things to do first."
      zh-CN: "用几条要点打开今天：仓库动态，以及最该先做的三件事。"
    name:
      en: "Morning Brief"
      zh-CN: "每日晨报"
    prompt:
      en: "Look at the commits, branches and uncommitted changes in the repository [repository path] over the past day, and list the three things to handle first today as short bullet points. Don't write prose."
      zh-CN: "查看仓库「填写仓库路径」过去一天的提交、分支和未提交变更，用简短条目列出今天最该先处理的三件事。不要写成散文。"
  paper_watch:
    description:
      en: "Explain this week's most worthwhile piece of research in plain words, and whether we can use it."
      zh-CN: "用白话讲清本周最值得看的一篇研究，以及能不能用上。"
    name:
      en: "Paper Digest"
      zh-CN: "论文速读"
    prompt:
      en: "Pick the most worthwhile research paper or technical article this week in [research area], explain the method and conclusions in plain words, and say whether we can use it in our work."
      zh-CN: "挑选本周「填写研究方向」最值得看的一篇研究或技术文章，用白话讲方法和结论，以及能不能用在我们的工作里。"
  pending_changes:
    description:
      en: "Check pending merge requests and uncommitted changes in the repository and flag the risks to look at first."
      zh-CN: "检查仓库里待审的合并请求和未提交变更，标出该先看的风险。"
    name:
      en: "Pending Changes"
      zh-CN: "待审变更"
    prompt:
      en: "Check the pending merge requests and uncommitted changes in the repository [repository path]. Flag risky files, testing gaps, and the order you suggest reviewing them in."
      zh-CN: "检查仓库「填写仓库路径」里待审的合并请求和未提交变更。标出风险文件、测试缺口，以及建议先看的顺序。"
  research:
    en: "Research"
    zh-CN: "研究"
  task_extractor:
    description:
      en: "Pull next steps out of recently changed files in your notes folder, deduplicated and grouped."
      zh-CN: "从笔记目录里最近改过的文件抽出可执行下一步，去重后分组。"
    name:
      en: "To-Do Extractor"
      zh-CN: "待办提取"
    prompt:
      en: "Read the files changed in the past day in the notes folder [folder path], extract actionable to-dos, remove duplicates, merge similar items, and group them into today / this week / later."
      zh-CN: "读取笔记目录「填写目录路径」里最近一天改过的文件，提取可执行待办，去重、合并相似项，按今天/本周/以后分组。"
  tech_digest:
    description:
      en: "Pick out model, framework and tool releases in the areas you follow, and say whether to follow up."
      zh-CN: "挑你关注方向的模型、框架、工具发布，说明要不要跟。"
    name:
      en: "Tech Digest"
      zh-CN: "技术动态"
    prompt:
      en: "Sum up model, framework and tool releases from the past day related to [technology areas to follow]. For each, explain the impact and whether it's worth following up on."
      zh-CN: "汇总过去一天里「填写关注的技术方向」相关的模型、框架、工具发布。每条说明影响和是否值得跟进。"
  weekly_review:
    description:
      en: "Wrap up the week from its commits: what got done, what's stuck, and just three priorities for next week."
      zh-CN: "按本周的提交收束完成项、卡住的问题，和下周只保留的三条优先级。"
    name:
      en: "Weekly Review"
      zh-CN: "每周回顾"
    prompt:
      en: "Review this week's commits and merges in the repository [repository path]: what got done, where things are stuck, and only three priorities for next week. Use bullet points and skip the filler."
      zh-CN: "回顾仓库「填写仓库路径」本周的提交和合并：做成了什么、卡在哪里、下周只保留三条优先级。用条目，不要套话。"
