# 内置插件「小人」（来源 id `smelt.buddies`）：会话行首会动的 3D 小人头像，填会话列表的行首
# 插槽。只依赖插件接口和第三方库。
[package]
name = "smelt-buddies"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 解小人的零件（编进来的 WebP）交给 gpui 画。版本跟 gpui 用的同一个，帧类型才对得上。
image = { version = "0.25", default-features = false, features = ["webp"] }
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true
