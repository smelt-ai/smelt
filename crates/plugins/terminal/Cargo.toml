# 内置插件「终端」（来源 id `smelt.terminal`）：每格终端是一个视图实例，连 smeltd 里的终端会话，
# 用 alacritty_terminal 解析、GPUI 画出来；还管终端字号和发给运行时的终端配色。只依赖插件接口
# 和第三方库。
[package]
name = "smelt-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-fast", version = "=0.1.17" }
# 终端网格的状态机；PTY 子进程在 smeltd 里。
alacritty_terminal = { version = "0.26", default-features = false }
# kitty 图形：守护转发来的 PNG 就地解码。
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
dirs = "5"
serde_json = "1"
smol = "2"
# 对外约定的参数类型（contract.rs）。
serde = { version = "1", features = ["derive"] }
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true

[dev-dependencies]
gpui = { package = "gpui-fast", version = "=0.1.17", features = ["test-support"] }
# 连真实守护的用例拉起 smeltd 时把就绪管道的写端递给它（清 CLOEXEC）。
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
