# 内置插件「更新与帮助」：设置「系统 → 关于」那一页（版本、在线更新、帮助与反馈），
# 在线更新的状态机（检查、静默下载、退出时安装、macOS 移到「应用程序」），以及「检查更新」
# 「帮助文档」「反馈问题」几条命令和菜单项。平台上怎么下载、换包在 smelt-client 的 updater
# 里，经插件接口拿；宿主里没有它的类型（见 docs/app-plugins.md）。
[package]
name = "smelt-updater-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-fast", version = "=0.1.17" }
# 下载线程往界面推进度的通道（见 update.rs）。
smol = "2"
anyhow = "1"
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true
