    en: Add
    zh-CN: 加入
switch:
  title:
    en: “%{name}” has unsaved changes
    zh-CN: 「%{name}」有未保存的改动
  description:
    en: You're switching to “%{name}”, but these changes aren't saved. What do you want to do?
    zh-CN: 要切换到「%{name}」了，这些改动还没保存，要怎么处理？
  save:
    en: Save and Switch
    zh-CN: 保存并切换
  discard:
    en: Switch Without Saving
    zh-CN: 不保存，直接切换
unreadable:
  image:
    en: (This image format can't be previewed)
    zh-CN: （无法预览这种图片格式）
  binary:
    en: "(Can't be read as text: it may be a binary file)"
    zh-CN: （无法以文本方式读取：可能是二进制文件）
  too_large:
    en: "(File too large: %{size} MB, the viewing limit is %{limit} MB)"
    zh-CN: （文件过大：%{size} MB，查看上限 %{limit} MB）
  error:
    en: "(Can't read: %{error})"
    zh-CN: （无法读取：%{error}）
save:
  unreadable:
    en: This file couldn't be read as text, so it can't be saved
    zh-CN: 此文件未能正常读取为文本，不支持保存
  read_only:
    en: This file is read-only. Click Edit to make changes.
    zh-CN: 此文件当前只读，点击「解锁编辑」后再修改。
  conflict:
    en: The file was changed outside; press ⌘S again to overwrite the changes on disk
    zh-CN: 文件已被外部修改；再按一次 ⌘S 会强制覆盖磁盘上的改动
  changed_elsewhere:
    en: This file was changed elsewhere; saving will report a conflict
    zh-CN: 这个文件已在别处被改过；保存时会提示冲突
  failed:
    en: "Couldn't save: %{error}"
    zh-CN: 保存失败：%{error}
browser:
  open:
    en: Open in Browser
    zh-CN: 浏览器打开
  bad_path:
    en: This path can't be turned into a file URL, so the browser can't open it
    zh-CN: 这个路径转不成文件地址，打不开浏览器
preview:
  show_source:
    en: View Source
    zh-CN: 查看原始码
  show_preview:
    en: View Preview
    zh-CN: 查看预览
  webview_failed:
    en: "The web view couldn't start: %{error}"
    zh-CN: 网页视图起不来：%{error}
  load_failed:
    en: "The page couldn't load: %{error}"
    zh-CN: 页面载入失败：%{error}
send:
  selection_menu:
    en: Send Selection to Session
    zh-CN: 发送选中内容到会话
  path_menu:
    en: Send to Session
    zh-CN: 发送到会话
  selection:
    en: "This selection from %{path}:\n```\n%{selected}\n```\n"
    zh-CN: "%{path} 里选中的这段：\n```\n%{selected}\n```\n"
  failed:
    en: "Couldn't send to the session: %{error}"
    zh-CN: 发送到会话失败：%{error}
reveal:
  finder:
    en: Show in Finder
    zh-CN: 在 Finder 中显示
  file_manager:
    en: Show in File Manager
    zh-CN: 在文件管理器中显示
delete:
  action:
    en: Delete
    zh-CN: 删除
  folder_menu:
    en: Delete Folder
    zh-CN: 删除文件夹
  file_menu:
    en: Delete File
    zh-CN: 删除文件
  folder_confirm:
    en: Delete this folder?
    zh-CN: 确定删除这个文件夹吗？
  file_confirm:
    en: Delete this file?
    zh-CN: 确定删除这个文件吗？
  folder_description:
    en: “%{name}” and everything in it will be permanently deleted. This can't be undone.
    zh-CN: 将永久删除「%{name}」及其全部内容，此操作不可撤销。
  file_description:
    en: “%{name}” will be permanently deleted. This can't be undone.
    zh-CN: 将永久删除「%{name}」，此操作不可撤销。
  failed:
    en: "Couldn't delete: %{error}"
    zh-CN: 删除失败：%{error}
