# 内置插件「远程机器」：这台电脑连出去的远程机器（添加、移除、改名、改中继、重连、升级），
# 以及设置「远程」页里让别的设备连进来的那一半（远程访问开关、自建 relay、配对新设备、撤销
# 设备）。连接表归宿主，经插件接口读写；远程访问的配置归本机运行时。只依赖插件接口。
[package]
name = "smelt-machines"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../../smelt-plugin-api" }
gpui = { package = "gpui-fast", version = "=0.1.17" }
# 照抄会话插件的菜单上下文，要按同样的 JSON 形状收。
serde = { version = "1", features = ["derive"] }
# 远程访问配置的保存按提交顺序一次一次来。
smol = "2"
# 配对串编成二维码给手机扫。
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true

[dev-dependencies]
gpui = { package = "gpui-fast", version = "=0.1.17", features = ["test-support"] }
