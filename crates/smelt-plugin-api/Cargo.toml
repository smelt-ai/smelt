# 插件和宿主之间唯一的接口（设计见 docs/app-plugins.md）。宿主 crate `smelt` 实现它，
# 过渡期的 Rust 插件 crate（crates/plugins/*）和 NSH 运行时（crates/smelt-nsh）只经这里
# 和宿主交互：协议类型、运行时客户端、共用界面由这里再导出。
[package]
name = "smelt-plugin-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-model = { path = "../smelt-model" }
smelt-client = { path = "../smelt-client" }
smelt-client-store = { path = "../smelt-client-store" }
smelt-runtime-client = { path = "../smelt-runtime-client" }
# 本机数据目录（`~/.smelt`，`SMELT_HOME` 可改）。
smelt-paths = { path = "../smelt-paths" }
# 进程资源占用（`process_usage`）：插件量桌面进程自己用。
smelt-sys = { path = "../smelt-sys" }
# 这个构建的版本号（「关于」页、菜单栏显示）。
smelt-version = { path = "../smelt-version" }
smelt-ui = { path = "../smelt-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { package = "gpui-fast", version = "=0.1.19" }
# 布局的格式（`DockAreaState`）。
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "82f1c1dc1f2970d93f1adfe10cbd772516c21ce7", features = ["gpui-fast"] }
futures-channel = "0.3"
# 界面语言：当前语言是 rust-i18n 的全局值，各 crate 的文案共用它（见 src/locale.rs）。
rust-i18n.workspace = true
# 读系统的首选语言。
sys-locale = "0.3"

[dev-dependencies]
gpui = { package = "gpui-fast", version = "=0.1.19", features = ["test-support"] }
smol = "2"
# 查各 crate 的文案（tests/catalogs.rs），用 rust-i18n 构建时同一个加载函数。
rust-i18n-support = { version = "4.2", features = ["codegen"] }
