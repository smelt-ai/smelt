# 插件和宿主之间唯一的接口（设计见 docs/app-plugins.md）。宿主 crate `smelt` 实现它，
# 内置插件 crate（crates/plugins/*）只依赖它和 gpui 组件库：插件要用的协议类型、共用
# 界面由这里再导出。`js` 特性把同一套接口映射成 JS 插件导入的 `smelt-plugin-api` 模块，
# 只有宿主开它（插件 crate 用不着 gpui-shell）。
[package]
name = "smelt-plugin-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-model = { path = "../smelt-model" }
smelt-client = { path = "../smelt-client" }
smelt-client-store = { path = "../smelt-client-store" }
smelt-runtime-client = { path = "../smelt-runtime-client" }
# 本机数据目录（`~/.smelt`，`SMELT_HOME` 可改）。
smelt-paths = { path = "../smelt-paths" }
# 进程资源占用（`process_usage`）：插件量桌面进程自己用。
smelt-sys = { path = "../smelt-sys" }
# 这个构建的版本号（「关于」页、菜单栏显示）。
smelt-version = { path = "../smelt-version" }
smelt-ui = { path = "../smelt-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { package = "gpui-pre", version = "=0.3.12" }
# 布局的格式（`DockAreaState`）。
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "69dab1accf3570bf3c0974bc32241bb031cc0b1b" }
futures-channel = "0.3"
# 界面语言：当前语言是 rust-i18n 的全局值，各 crate 的文案共用它（见 src/locale.rs）。
rust-i18n.workspace = true
# 读系统的首选语言。
sys-locale = "0.3"
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "69dab1accf3570bf3c0974bc32241bb031cc0b1b", default-features = false, features = ["quickjs"], optional = true }

[features]
js = ["dep:gpui-shell"]

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
smol = "2"
# 查各 crate 的文案（tests/catalogs.rs），用 rust-i18n 构建时同一个加载函数。
rust-i18n-support = { version = "4.2", features = ["codegen"] }
