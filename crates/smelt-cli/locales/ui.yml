help.plugins:
  en: "\nSmelt plugins (the app's own NSH TSX/JS UI plugins in ~/.smelt/plugins/<id>/; no smeltd needed):\n  smelt plugin init <id> [--theme] [--name <name>] [--dir <dir>]   create a starter TSX plugin (or pure theme plugin with --theme)\n  smelt plugin fork <builtin-id> [--as <new-id>] [--dir <dir>]     copy a built-in plugin to override it (or rename with --as)\n  smelt plugin types <dir>                                         generate or refresh .nsh/types and tsconfig.json\n  smelt plugin check <dir>                                         validate manifest, locales, themes, bundle, imports and QuickJS compile; exits 1 on errors\n  smelt plugin status [<id>]                                       what the running app loaded, registered views, override/fallback state and errors\n"
  zh-CN: "\nSmelt 插件（App 自己的 NSH TSX/JS 界面插件，写在 ~/.smelt/plugins/<id>/；不需要 smeltd）：\n  smelt plugin init <id> [--theme] [--name <名称>] [--dir <目录>]   创建起步 TSX 插件（加 --theme 创建纯主题插件）\n  smelt plugin fork <自带id> [--as <新id>] [--dir <目录>]          拷贝自带插件到用户目录（同 id 覆写自带，--as 改名并存）\n  smelt plugin types <目录>                                        生成或刷新 .nsh/types 和 tsconfig.json\n  smelt plugin check <目录>                                        离线校验清单、文案、主题、TSX 打包、import 与 QuickJS 编译，有错退出码 1\n  smelt plugin status [<id>]                                       开着的 App 加载了哪些插件、登记视图、覆写/回退状态及失败原因\n"
