_version: 2
help.text:
  en: |
    smelt %{version}

    Usage (stdout is JSON; smeltd must be running):
    %{gui}
    Agents (saved definitions, not running conversations):
      smelt agent list | get <id> | delete <id>
      smelt agent create --name <name> [options]
      smelt agent update <id> [options]       list options replace the whole list; pass "" to clear
          --prompt <how to work>  --engine <id>  --memory on|off
          --plugin <id>...  --mcp <server name>...  --folder <path>...  --link <url>...
          --model <provider>/<model id> | --model default
      smelt agent chat <id> [--message <first message>]   start a conversation from it

    Conversations:
      smelt conversation list [--agent <agent id>] [--archived]
      smelt conversation rename <id> --title <title>
      smelt conversation archive|unarchive|delete <id>

    Automations:
      smelt automation list | get <id>
      smelt automation create --name <name> (--agent <agent id> [--prompt <instructions>] | --shell <command>) <trigger>... [--notify on|off]
      smelt automation update <id> [--name ...] [--agent ...] [--prompt ...] [--shell ...] [<trigger>...] [--notify on|off]
          Triggers (can be combined):
          --every-minutes N  --every-hours N  --daily HH:MM
          --weekly mon,wed,fri@HH:MM          --during 30@09:00-18:00[@weekdays]
          --webhook  --event <topic> [--event-filter '{"field":"value"}']
          On update: any schedule replaces all schedules, same for --event; --webhook keeps an existing URL;
          --no-schedule / --no-webhook / --no-event remove that kind
      smelt automation enable|disable|run|delete <id>
      smelt automation runs [<id>] [--limit N]     recent runs
      smelt automation run-log <run_id>            output and transcript of one run
      smelt automation cancel <run_id>

    Capabilities (apply to every agent):
      smelt mcp list | presets | add <preset id> | enable|disable|remove <server name>
      smelt pi skill list | import <directory> | remove <name>
      smelt pi extension list | import <path> | remove <name>
      smelt model list | default <provider>/<model id> | thinking off|minimal|low|medium|high|xhigh
      smelt quota
    %{plugins}
    Notifications (shown on the desktop and pushed to phones with "Agent messages" on):
      smelt notify [--title <title>] <message>

    Settings:
      smelt settings get
      smelt settings set appearance.theme_mode=light appearance.ui_font_px=16
      smelt settings set appearance.theme="Ayu Dark"
      smelt settings set memory.embedding_base_url=http://localhost:11434/v1 memory.embedding_model=bge-m3
  zh-CN: |
    smelt %{version}

    用法（stdout 为 JSON，都需要 smeltd 在跑）：
    %{gui}
    智能体（长期定义，不是正在跑的对话）：
      smelt agent list | get <id> | delete <id>
      smelt agent create --name <名称> [选项]
      smelt agent update <id> [选项]          列表类选项整份替换，写 "" 清空
          --prompt <工作方式>  --engine <id>  --memory on|off
          --plugin <id>...  --mcp <服务器名>...  --folder <路径>...  --link <地址>...
          --model <provider>/<模型id> | --model default
      smelt agent chat <id> [--message <第一句话>]   用该定义开一场对话

    对话：
      smelt conversation list [--agent <智能体id>] [--archived]
      smelt conversation rename <id> --title <标题>
      smelt conversation archive|unarchive|delete <id>

    自动化：
      smelt automation list | get <id>
      smelt automation create --name <名称> (--agent <智能体id> [--prompt <指令>] | --shell <命令>) <触发>... [--notify on|off]
      smelt automation update <id> [--name ...] [--agent ...] [--prompt ...] [--shell ...] [<触发>...] [--notify on|off]
          触发（可以组合）：
          --every-minutes N  --every-hours N  --daily HH:MM
          --weekly mon,wed,fri@HH:MM          --during 30@09:00-18:00[@weekdays]
          --webhook  --event <主题> [--event-filter '{"字段":"值"}']
          update 时：给了定时就整组换掉定时，--event 同理，--webhook 已有就保留原地址；
          --no-schedule / --no-webhook / --no-event 去掉那一类
      smelt automation enable|disable|run|delete <id>
      smelt automation runs [<id>] [--limit N]     最近的运行
      smelt automation run-log <run_id>            一次运行的输出和对话记录
      smelt automation cancel <run_id>

    能力（对所有智能体生效）：
      smelt mcp list | presets | add <预设id> | enable|disable|remove <服务器名>
      smelt pi skill list | import <目录> | remove <名字>
      smelt pi extension list | import <路径> | remove <名字>
      smelt model list | default <provider>/<模型id> | thinking off|minimal|low|medium|high|xhigh
      smelt quota
    %{plugins}
    通知（桌面弹出，并推给在手机端打开了「智能体消息」的手机）：
      smelt notify [--title <标题>] <内容>

    设置：
      smelt settings get
      smelt settings set appearance.theme_mode=light appearance.ui_font_px=16
      smelt settings set appearance.theme="Ayu Dark"
      smelt settings set memory.embedding_base_url=http://localhost:11434/v1 memory.embedding_model=bge-m3
