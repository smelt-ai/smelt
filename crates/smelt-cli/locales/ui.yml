_version: 2
help.text:
  en: |
    smelt %{version}

    Usage (stdout is JSON; smeltd must be running):
    %{gui}
    Agents (saved definitions, not running conversations):
      smelt agent list | get <id> | delete <id>
      smelt agent create --name <name> [options]
      smelt agent update <id> [options]       list options replace the whole list (skills and extensions separately); pass "" to clear
          --prompt <how to work>  --engine <id>  --memory on|off
          --skill <name>...  --extension <name>...  --mcp <server name>...
          --folder <path>...  --link <url>...
          --model <provider>/<model id> | --model default
      smelt agent chat <id> [--message <first message>]   start a conversation from it
      smelt agent memory <id>                 its memory and the shared user memory (approve/delete on the desktop)

    Conversations:
      smelt conversation list [--agent <agent id>] [--archived]
      smelt conversation send <id> --message <message>   queue a turn, returns delivery_id
      smelt conversation result <id> <delivery_id>       pending | finished (with the reply) | unknown
      smelt conversation rename <id> --title <title>
      smelt conversation archive|unarchive|delete <id>

    Projects and worktrees:
      smelt project list | open <path> | close <path>
      smelt worktree list [--project <path>]
      smelt worktree create <project> --task <task name> [--repo <name>...] [--branch <branch>] [--prefix <branch prefix>] [--base <base branch>]
      smelt worktree inspect <id>            before finishing: clean? merged?
      smelt worktree finish <id> [--allow-unconfirmed-merge]

    History (each agent's own saved sessions, per project directory):
      smelt history list --agent <id> [--cwd <dir>] [--profile <id>]
      smelt history get <path> --agent <id>
      smelt history delete <resume_id> --agent <id> [--cwd <dir>] [--profile <id>]

    Automations:
      smelt automation list | get <id>
      smelt automation create --name <name> (--agent <agent id> [--prompt <instructions>] | --shell <command>) <trigger>... [--notify on|off]
      smelt automation update <id> [--name ...] [--agent ...] [--prompt ...] [--shell ...] [<trigger>...] [--notify on|off]
          Triggers (can be combined):
          --every-minutes N  --every-hours N  --daily HH:MM
          --weekly mon,wed,fri@HH:MM          --during 30@09:00-18:00[@weekdays]
          --webhook  --event <topic> [--event-filter '{"field":"value"}']
          On update: any schedule replaces all schedules, same for --event; --webhook keeps an existing URL;
          --no-schedule / --no-webhook / --no-event remove that kind
      smelt automation enable|disable|run|delete <id>
      smelt automation runs [<id>] [--limit N]     recent runs
      smelt automation run-log <run_id>            output and transcript of one run
      smelt automation cancel <run_id>

    Capabilities (apply to every agent):
      smelt mcp list | presets | add <preset id> | enable|disable|remove <server name>
      smelt pi skill list | import <directory> | remove <name>
      smelt pi extension list | import <path> | remove <name>
      smelt model list | default <provider>/<model id> | thinking off|minimal|low|medium|high|xhigh|max
      smelt quota | quota refresh [<account id>] | quota settings | quota enable|disable <account id>

    Agent engines:
      smelt engine list | install <id>       command-line tools found / install one (brew or npm)
      smelt hooks status | install | uninstall   notification hooks in each agent's config

    The open Smelt app (commands its plugins allow from the command line):
      smelt app commands                     the commands and the arguments each takes
      smelt app run <command id> [--args '<JSON>']   e.g. smelt app run smelt.app/open-view --args '{"view":"<plugin id>/<view>"}'
    %{plugins}
    Notifications (shown on the desktop and pushed to phones with "Agent messages" on):
      smelt notify [--title <title>] <message>

    Settings:
      smelt settings get
      smelt settings set appearance.theme_mode=light appearance.ui_font_px=16
      smelt settings set appearance.theme="Ayu Dark"
      smelt settings set memory.embedding_base_url=http://localhost:11434/v1 memory.embedding_model=bge-m3
  zh-CN: |
    smelt %{version}

    用法（stdout 为 JSON，都需要 smeltd 在跑）：
    %{gui}
    智能体（长期定义，不是正在跑的对话）：
      smelt agent list | get <id> | delete <id>
      smelt agent create --name <名称> [选项]
      smelt agent update <id> [选项]          列表类选项整份替换（技能、扩展各算一份），写 "" 清空
          --prompt <工作方式>  --engine <id>  --memory on|off
          --skill <名字>...  --extension <名字>...  --mcp <服务器名>...
          --folder <路径>...  --link <地址>...
          --model <provider>/<模型id> | --model default
      smelt agent chat <id> [--message <第一句话>]   用该定义开一场对话
      smelt agent memory <id>                 它的记忆和共享的用户记忆（采纳、删除在桌面上）

    对话：
      smelt conversation list [--agent <智能体id>] [--archived]
      smelt conversation send <id> --message <内容>     排进一轮，返回 delivery_id
      smelt conversation result <id> <delivery_id>      pending | finished（带回复）| unknown
      smelt conversation rename <id> --title <标题>
      smelt conversation archive|unarchive|delete <id>

    项目和工作树：
      smelt project list | open <路径> | close <路径>
      smelt worktree list [--project <路径>]
      smelt worktree create <项目> --task <任务名> [--repo <仓库名>...] [--branch <分支>] [--prefix <分支前缀>] [--base <基线分支>]
      smelt worktree inspect <id>            收工前看：干不干净、合没合
      smelt worktree finish <id> [--allow-unconfirmed-merge]

    历史（各家 agent 自己存的会话，按项目目录）：
      smelt history list --agent <id> [--cwd <目录>] [--profile <id>]
      smelt history get <存档路径> --agent <id>
      smelt history delete <resume_id> --agent <id> [--cwd <目录>] [--profile <id>]

    自动化：
      smelt automation list | get <id>
      smelt automation create --name <名称> (--agent <智能体id> [--prompt <指令>] | --shell <命令>) <触发>... [--notify on|off]
      smelt automation update <id> [--name ...] [--agent ...] [--prompt ...] [--shell ...] [<触发>...] [--notify on|off]
          触发（可以组合）：
          --every-minutes N  --every-hours N  --daily HH:MM
          --weekly mon,wed,fri@HH:MM          --during 30@09:00-18:00[@weekdays]
          --webhook  --event <主题> [--event-filter '{"字段":"值"}']
          update 时：给了定时就整组换掉定时，--event 同理，--webhook 已有就保留原地址；
          --no-schedule / --no-webhook / --no-event 去掉那一类
      smelt automation enable|disable|run|delete <id>
      smelt automation runs [<id>] [--limit N]     最近的运行
      smelt automation run-log <run_id>            一次运行的输出和对话记录
      smelt automation cancel <run_id>

    能力（对所有智能体生效）：
      smelt mcp list | presets | add <预设id> | enable|disable|remove <服务器名>
      smelt pi skill list | import <目录> | remove <名字>
      smelt pi extension list | import <路径> | remove <名字>
      smelt model list | default <provider>/<模型id> | thinking off|minimal|low|medium|high|xhigh|max
      smelt quota | quota refresh [<账户id>] | quota settings | quota enable|disable <账户id>

    Agent 引擎：
      smelt engine list | install <id>       找到的命令行工具 / 装一个（brew 或 npm）
      smelt hooks status | install | uninstall   写在各家 agent 配置里的提醒钩子

    开着的 Smelt App（插件开给命令行的命令）：
      smelt app commands                     有哪些命令、各认什么参数
      smelt app run <命令id> [--args '<JSON>']   如 smelt app run smelt.app/open-view --args '{"view":"<插件id>/<视图>"}'
    %{plugins}
    通知（桌面弹出，并推给在手机端打开了「智能体消息」的手机）：
      smelt notify [--title <标题>] <内容>

    设置：
      smelt settings get
      smelt settings set appearance.theme_mode=light appearance.ui_font_px=16
      smelt settings set appearance.theme="Ayu Dark"
      smelt settings set memory.embedding_base_url=http://localhost:11434/v1 memory.embedding_model=bge-m3
