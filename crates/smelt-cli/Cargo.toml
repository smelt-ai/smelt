# smelt 的命令行：智能体、对话、自动化、MCP/插件/模型、设置（全部见 src/lib.rs 的 print_help）。
# lib 给 GUI 的 smelt 在启动时先拦截子命令；bin 是控制台的同一套命令：Windows 发版时改名成
# smelt.com 放在 smelt.exe 旁边，Linux 运行时包里以 smelt 为名分发（见 src/main.rs）。
[package]
name = "smelt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-model = { path = "../smelt-model" }
smelt-runtime-client = { path = "../smelt-runtime-client" }
smelt-client = { path = "../smelt-client" }
smelt-version = { path = "../smelt-version" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Windows 上 canonicalize 给的是 `\\?\D:\…`，dunce 换回桌面、历史记录用的 `D:\…`。
dunce = "1"
# 运行时报错的原因（ControlReason）按系统语言说；当前语言是 rust-i18n 的全局值。
rust-i18n.workspace = true
sys-locale = "0.3"
