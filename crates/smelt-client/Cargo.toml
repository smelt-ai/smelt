[package]
name = "smelt-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# 桌面客户端访问运行时的部分：状态订阅、ACP 会话连接、会话与自动化
# 的守护操作。只走协议，不依赖 smelt-core 和运行时的库（设计文档 P1）。

[dependencies]
smelt-sys = { path = "../smelt-sys" }
anyhow = "1"
dirs.workspace = true
reqwest = { version = "0.13", features = ["json"] }
# 更新器拿编进程序的发版号（smelt-version）和更新源的版本号比新旧。
semver = "1"
smelt-version = { path = "../smelt-version" }
url = "2"
smelt-event-protocol = { path = "../smelt-event-protocol" }
smelt-model = { path = "../smelt-model" }
smelt-runtime-client = { path = "../smelt-runtime-client" }
smelt-paths = { path = "../smelt-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# 「移到应用程序」和 macOS 更新器的 flock / dlopen 只在 macOS 上编（设计文档 D4）。
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

# Windows 的更新对着发版的 SHA256SUMS 校验安装程序。
[target.'cfg(windows)'.dependencies]
sha2.workspace = true
hex = "0.4"

[dev-dependencies]
tempfile = "3"
