[package]
name = "smelt-client"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# 桌面客户端访问运行时的部分：状态订阅、ACP 会话连接、会话与自动化
# 的守护操作。只走协议，不依赖 smelt-core 和运行时的库（设计文档 P1）。

[dependencies]
smelt-client-store = { path = "../smelt-client-store" }
smelt-sys = { path = "../smelt-sys" }
anyhow = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
smelt-event-protocol = { path = "../smelt-event-protocol" }
smelt-model = { path = "../smelt-model" }
smelt-runtime-client = { path = "../smelt-runtime-client" }
smelt-paths = { path = "../smelt-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
uuid = { version = "1", features = ["v4"] }

# 「移到应用程序」和更新器的 flock / dlopen 只在 macOS 上编（设计文档 D4）。
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3"

# 造 ACP 快照的测试依赖 smelt-core。那一层是 Unix 进程模型，第 1 步不在 Windows 上编。
[target.'cfg(unix)'.dev-dependencies]
smelt-core = { path = "../smelt-core", features = ["test-support"] }
