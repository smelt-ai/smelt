[package]
name = "smeltd"
version.workspace = true
edition.workspace = true

# 守护侧无 GUI 二进制：smeltd（运行时守护，src/main.rs）、smelt-notify（agent hook →
# smeltd 的翻译小工具）。
# 独立成 crate 的意义：依赖树彻底脱离 GPUI，改守护不用等 GUI 依赖编译。

[lints]
workspace = true

[dependencies]
dirs = "5"
notify = "8"
smelt-paths = { path = "../smelt-paths" }
smelt-core = { path = "../smelt-core" }
smelt-sys = { path = "../smelt-sys" }
smelt-event-protocol = { path = "../smelt-event-protocol" }
smelt-runtime-client = { path = "../smelt-runtime-client" }
smelt-git = { path = "../smelt-git" }
smelt-event-bus = { path = "../smelt-event-bus" }
smelt-store = { path = "../smelt-store" }
# 远程访问：iroh endpoint 直接接收运行时协议的流。
smelt-iroh = { path = "../smelt-iroh" }
smelt-pairing = { path = "../smelt-pairing" }
# `smeltd pair` 在终端里打印配对二维码。
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap.workspace = true
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
# smeltd 无缝升级：PTY master 裸 fd 的 dup/CLOEXEC/ioctl(TIOCSWINSZ)/kill/waitpid。
libc = "0.2"
alacritty_terminal = { version = "0.26", default-features = false }
axum = { version = "0.8.9", features = ["ws"] }
# ACP 会话托管：直接复用 smelt-core::acp_conn 的连接驱动，不重写一遍。
# 本 crate 只用稳定 schema 类型（SessionId / StopReason）。进程启动与计划
# 增量更新的 feature 留在 smelt-core。
agent-client-protocol = "=3.4.0"
smol = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
# `conversation.image`：手机按需取对话里的图，缩略图在运行时这边解码、缩放、重新编码。
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# 桌面请运行时升级时比版本（只升不降），也挡住拼进下载地址的非法版本号。
semver = "1"

[dev-dependencies]
smelt-core = { path = "../smelt-core", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework-sys = "2.17"
