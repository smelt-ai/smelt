# GUI 主程序。package 名即产物名 smelt——与 app 包内可执行名、产品名统一
# （Makefile / package-mac.sh / smeltd 菜单栏的同目录寻址都按这个名字取）。
[package]
name = "smelt"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
smelt-paths = { path = "../smelt-paths" }
# GUI/守护共用的无 UI 逻辑（终端文本、OSC 扫描、权限菜单解析、远程网关）。
smelt-core = { path = "../smelt-core" }
smelt-git = { path = "../smelt-git" }
smelt-store = { path = "../smelt-store" }
smelt-pairing = { path = "../smelt-pairing" }
smelt-plugin-api = { path = "../smelt-plugin-api" }
smelt-plugin-host = { path = "../smelt-plugin-host" }
# 共享 GPUI UI 基建（色板/markdown+mermaid/@补全/ACP agent UI 偏好数据模型）与
# ACP 会话消息流渲染层，均已独立成 crate（见各自 Cargo.toml 文件头注释）。
smelt-ui = { path = "../smelt-ui" }
# 插件自留地面板的 WebView 宿主（spike，见 crates/smelt-webview）。
smelt-webview = { path = "../smelt-webview" }
smelt-acp-view = { path = "../smelt-acp-view" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
url = "2"
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", features = ["sink", "async-await"] }
# ACP 对话粘贴图片：协议要 base64 后的字节（见 acp.rs 的 PromptImage）。
base64 = "0.22"
# GPUI + gpui-component（组件库，Apache-2.0）。gpui-component 已改为跟随 Zed
# 主线，直接依赖保持同一 source，由 Cargo.lock 固定精确 revision，避免解析出
# 两套不兼容的 GPUI 类型；gpui_platform 开 runtime_shaders 免装完整 Xcode。
gpui = { git = "https://github.com/zed-industries/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5" }
gpui-base = { git = "https://github.com/zzfn/gpui-component", rev = "0ba9d922e335185e654a6c0ac643f5f1a1e9370d" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# tree-sitter-languages：文件树打开文件用组件自带的 Editor（CodeEditor 模式），
# 语法高亮 + 行号 + 搜索都是组件自己做的，不再需要 syntect。
gpui-component = { git = "https://github.com/zzfn/gpui-component", rev = "0ba9d922e335185e654a6c0ac643f5f1a1e9370d", features = ["tree-sitter-languages"] }
# 组件库自带图标资源（Sidebar 等组件的 IconName 需要注册它才能渲染 svg）。
gpui-component-assets = { git = "https://github.com/zzfn/gpui-component", rev = "0ba9d922e335185e654a6c0ac643f5f1a1e9370d" }
# 内嵌终端网格仍由 alacritty_terminal 驱动；PTY 子进程已迁到 smeltd。
libc = "0.2"
alacritty_terminal = { version = "0.26", default-features = false }
smol = "2"  # 定时器：驱动终端网格的定时快照重绘
# ACP（Agent Client Protocol）客户端：第二种会话类型（结构化消息流，见 docs/
# project-report.md 第 5 节）。官方 SDK（Apache-2.0），executor 无关，锁 2.1 防漂移。
# elicitation 已进稳定协议。unstable_plan_operations 仍是未定稿的计划增量更新。
agent-client-protocol = { version = "=2.1.0", features = ["unstable_plan_operations"] }
# Git 状态改用文件监听而非轮询：macOS 走 FSEvents，仓库一有变化就标脏触发刷新。
notify = "6"
# 遵循 .gitignore 的高性能文件遍历与搜索
ignore = "0.4"
# 设置页跨网分享链接二维码
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# mermaid 渲染缓存文件名用内容 hash 命名，避免重复渲染同一张图。
sha2 = "0.10"
# 生成 agent hook 命令时按 shell 规则引用 smelt-notify 路径。
shell-words = "1"
# macOS：菜单栏 status item 需要直接操作 AppKit（GPUI 没有 status item 概念），
# 用 objc crate 声明 Objective-C 类做 target-action。系统通知使用现代、带异步回执的
# UserNotifications API；objc2 相关版本与现有依赖树对齐。
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "e0931d5a9dbf4f781b336fdf448739e74a2ac0b5", features = ["test-support"] }
rusqlite = { version = "0.37", features = ["bundled"] }
