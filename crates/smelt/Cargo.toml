# GUI 主程序。package 名即产物名 smelt——与 app 包内可执行名、产品名统一
# （Makefile / package-mac.sh / smeltd 菜单栏的同目录寻址都按这个名字取）。
[package]
name = "smelt"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
smelt-sys = { path = "../smelt-sys" }
smelt-model = { path = "../smelt-model" }
smelt-client = { path = "../smelt-client" }
smelt-cli = { path = "../smelt-cli" }
smelt-paths = { path = "../smelt-paths" }
smelt-version = { path = "../smelt-version" }
smelt-pairing = { path = "../smelt-pairing" }
smelt-iroh = { path = "../smelt-iroh" }
smelt-runtime-client = { path = "../smelt-runtime-client" }
smelt-client-store = { path = "../smelt-client-store" }
# 共享 GPUI UI 基建（色板/markdown+mermaid/@补全/ACP agent UI 偏好数据模型）与
# ACP 会话消息流渲染层，均已独立成 crate（见各自 Cargo.toml 文件头注释）。
smelt-ui = { path = "../smelt-ui" }
smelt-acp-view = { path = "../smelt-acp-view" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 插件的 console 输出是 gpui-shell 发的 tracing 事件，接到 app.log（见 src/plugins/log.rs）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
reqwest = { version = "0.13", features = ["json"] }
url = "2"
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", features = ["sink", "async-await"] }
# GPUI 用上游 gpui-kit 钉的 crates.io 快照 gpui-pre =0.3.9。
# 组件库跟 longbridge/gpui-kit 上游 main，不用 fork。两边必须同一套，
# 不能只改其中一个。gpui_platform 开 runtime_shaders 免装完整 Xcode。
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "219fc1a9bdd6236c3a58f07c810e1b87079890c1" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# tree-sitter-languages：文件树打开文件用组件自带的 Editor（CodeEditor 模式），
# 语法高亮 + 行号 + 搜索都是组件自己做的，不再需要 syntect。
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "219fc1a9bdd6236c3a58f07c810e1b87079890c1", features = ["tree-sitter-languages"] }
# 组件库自带图标资源（Sidebar 等组件的 IconName 需要注册它才能渲染 svg）。
# 上游已把包名从 gpui-component-assets 改成 gpui-kit-assets。
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit", rev = "219fc1a9bdd6236c3a58f07c810e1b87079890c1" }
# 调试 HUD（Cmd+Shift+F）：帧耗时取自 GPUI 自己的帧追踪，不靠连续重绘去量。
gpui-fps = { git = "https://github.com/longbridge/gpui-kit", rev = "219fc1a9bdd6236c3a58f07c810e1b87079890c1" }
# 插件：gpui-shell 脚本应用（见 src/plugins）。JS 写界面，GPUI 原生绘制，
# 引擎 QuickJS 跑在 UI 线程。`components` 把 gpui-component 的控件登记进脚本运行时。
# 不开默认的 `webview`：它会把整个运行时切到 gpui-fast，而 smelt 用 gpui-pre。
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "219fc1a9bdd6236c3a58f07c810e1b87079890c1", default-features = false, features = ["quickjs", "components"] }
# 内嵌终端网格仍由 alacritty_terminal 驱动；PTY 子进程已迁到 smeltd。
libc = "0.2"
alacritty_terminal = { version = "0.26", default-features = false }
smol = "2"  # 定时器：驱动终端网格的定时快照重绘
# 盯着 App 里的 smeltd：重编译、覆盖安装后查一次守护是否落后（见 Workspace::start_daemon_outdated_watch）。
notify = "8"
# ACP（Agent Client Protocol）客户端：第二种会话类型（结构化消息流，见 docs/
# project-report.md 第 5 节）。官方 SDK（Apache-2.0），executor 无关，锁 3.4 防漂移。
# 这里只用稳定 schema 类型（SessionId）。线协议由 smelt-core 握手钉在 V1；
# crate 大版本升级不等于协商 wire v2。
agent-client-protocol = "=3.4.0"
# Git 状态改用文件监听而非轮询：macOS 走 FSEvents，仓库一有变化就标脏触发刷新。
# 设置页跨网分享链接二维码
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# 远程桌面页：noVNC 跑在原生网页视图里。gpui-webview 和上面的组件库同一个 rev，一起升级；
# crates.io 上的 gpui-wry 是它改名前的旧名字，钉死了 gpui-pre 版本，会卡住升级。
# 不开 gpui-fast：跟着 gpui-kit 用默认的 gpui-pre，代价是网页视图盖住同一块区域里的 GPUI
# 弹层。gpui-shell 也不能开它的 webview 特性，那会把整个应用切到 GPUI Fast。
# wry 必须和它用同一份。
gpui-webview = { git = "https://github.com/longbridge/gpui-kit", rev = "219fc1a9bdd6236c3a58f07c810e1b87079890c1" }
wry = { package = "lb-wry", version = "0.53.3" }
# 生成 agent hook 命令时按 shell 规则引用 smelt-notify 路径。
# macOS：菜单栏 status item 需要直接操作 AppKit（GPUI 没有 status item 概念），
# 用 objc crate 声明 Objective-C 类做 target-action。系统通知使用现代、带异步回执的
# UserNotifications API；objc2 相关版本与现有依赖树对齐。
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
raw-window-handle = "0.6"

[dev-dependencies]
# 测试要用运行时的归约器和存储层校验格式；正式代码不依赖它们（设计文档 P1）。
smelt-store = { path = "../smelt-store" }
# 版本协商的测试要按这个桌面的事件投影版本扮一台运行时。
smelt-event-protocol = { path = "../smelt-event-protocol" }
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
rusqlite = { version = "0.40", features = ["bundled"] }

# smelt-core 是 smeltd 的进程和套接字层，第 1 步不移植到 Windows。测试里用到它的
# 代码都在 Unix 上；Windows 的 `cargo check --all-targets` 不该把它编进来。
[target.'cfg(unix)'.dev-dependencies]
smelt-core = { path = "../smelt-core" }

# 构建脚本编给主机。图标只在 Windows 目标上嵌（见 build.rs），清单不在这里，
# gpui-pre 的 windows-manifest 已经嵌了一份。
[build-dependencies]
embed-resource = "=3.0.12"
