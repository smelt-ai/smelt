# GUI 主程序。package 名即产物名 smelt——与 app 包内可执行名、产品名统一
# （Makefile / package-mac.sh / smeltd 菜单栏的同目录寻址都按这个名字取）。
[package]
name = "smelt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-sys = { path = "../smelt-sys" }
smelt-model = { path = "../smelt-model" }
smelt-event-protocol = { path = "../smelt-event-protocol" }
smelt-client = { path = "../smelt-client" }
smelt-cli = { path = "../smelt-cli" }
smelt-paths = { path = "../smelt-paths" }
smelt-version = { path = "../smelt-version" }
smelt-pairing = { path = "../smelt-pairing" }
smelt-iroh = { path = "../smelt-iroh" }
smelt-runtime-client = { path = "../smelt-runtime-client" }
smelt-client-store = { path = "../smelt-client-store" }
# 共享 GPUI 组件库（见它的 Cargo.toml 文件头注释）。
smelt-ui = { path = "../smelt-ui" }
smelt-plugin-api = { path = "../smelt-plugin-api", features = ["js"] }
# 内置插件：只在 `plugin_host::install` 里登记，宿主别处不认识它们。
smelt-agents = { path = "../plugins/agents" }
smelt-archive = { path = "../plugins/archive" }
smelt-automations = { path = "../plugins/automations" }
smelt-buddies = { path = "../plugins/buddies" }
smelt-capabilities = { path = "../plugins/capabilities" }
smelt-conversation = { path = "../plugins/conversation" }
smelt-desktop = { path = "../plugins/desktop" }
smelt-files-ui = { path = "../plugins/files" }
smelt-git-ui = { path = "../plugins/git" }
smelt-history = { path = "../plugins/history" }
smelt-ide = { path = "../plugins/ide" }
smelt-launcher = { path = "../plugins/launcher" }
smelt-language = { path = "../plugins/language" }
smelt-layouts = { path = "../plugins/layouts" }
smelt-machines = { path = "../plugins/machines" }
smelt-maintenance = { path = "../plugins/maintenance" }
smelt-notifications = { path = "../plugins/notifications" }
smelt-resources = { path = "../plugins/resources" }
smelt-sessions = { path = "../plugins/sessions" }
smelt-skills = { path = "../plugins/skills" }
smelt-terminal = { path = "../plugins/terminal" }
smelt-themes = { path = "../plugins/themes" }
smelt-updater-ui = { path = "../plugins/updater" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 插件的 console 输出是 gpui-shell 发的 tracing 事件，接到 app.log（见 src/plugins/log.rs）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
reqwest = { version = "0.13", features = ["json"] }
url = "2"
anyhow = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", features = ["sink", "async-await"] }
# GPUI 用上游 gpui-kit 钉的 crates.io 快照 gpui-pre =0.3.12。
# gpui-kit 各 crate 跟 longbridge/gpui-kit 上游 main，不用 fork。两边必须同一套，
# 不能只改其中一个。gpui_platform 开 runtime_shaders 免装完整 Xcode。
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "69dab1accf3570bf3c0974bc32241bb031cc0b1b" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# 调试 HUD（Cmd+Shift+F）：帧耗时取自 GPUI 自己的帧追踪，不靠连续重绘去量。
gpui-fps = { git = "https://github.com/longbridge/gpui-kit", rev = "69dab1accf3570bf3c0974bc32241bb031cc0b1b" }
# 插件：gpui-shell 脚本应用（见 src/plugins）。JS 写界面，GPUI 原生绘制，
# 引擎 QuickJS 跑在 UI 线程。脚本能用的控件是 smelt-ui 的（`smelt_plugin_api::js::ui`），
# 不开 `components`：那会带进 gpui-component 和它的控件目录。
# 不开默认的 `webview`：它会把整个运行时切到 gpui-fast，而 smelt 用 gpui-pre。
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "69dab1accf3570bf3c0974bc32241bb031cc0b1b", default-features = false, features = ["quickjs"] }
libc = "0.2"
smol = "2"  # 定时器、channel
# 盯着 App 里的 smeltd：重编译、覆盖安装后查一次守护是否落后（见 Workspace::start_daemon_outdated_watch）。
notify = "8"
# 菜单栏图标按颜色重新着色（见 src/status_item.rs 的 `tint_png`）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# macOS：菜单栏 status item 需要直接操作 AppKit（GPUI 没有 status item 概念），
# 用 objc crate 声明 Objective-C 类做 target-action。系统通知使用现代、带异步回执的
# UserNotifications API；objc2 相关版本与现有依赖树对齐。
# 界面文案（locales/ui.yml，见 docs/i18n.md）。
rust-i18n.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
raw-window-handle = "0.6"

[dev-dependencies]
# 测试要用运行时的归约器和存储层校验格式；正式代码不依赖它们（设计文档 P1）。
smelt-store = { path = "../smelt-store" }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
rusqlite = { version = "0.41", features = ["bundled"] }

# smelt-core 是 smeltd 的进程和套接字层，第 1 步不移植到 Windows。测试里用到它的
# 代码都在 Unix 上；Windows 的 `cargo check --all-targets` 不该把它编进来。
[target.'cfg(unix)'.dev-dependencies]
smelt-core = { path = "../smelt-core" }

# Windows 11 的 Mica 要按窗口设深浅，系统版本要绕过兼容层读真的（见 window_backdrop.rs）。
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_SystemInformation",
] }

# 构建脚本编给主机。图标只在 Windows 目标上嵌（见 build.rs），清单不在这里，
# gpui-pre 的 windows-manifest 已经嵌了一份。
[build-dependencies]
embed-resource = "=3.0.12"
