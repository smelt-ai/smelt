    zh-CN: "正在重启"
  restarting_local:
    en: "Restarting the local runtime"
    zh-CN: "正在重启本机运行时"
  send_failed:
    en: "Couldn't send the upgrade request: %{error}"
    zh-CN: "发不出升级请求：%{error}"
  staged:
    en: "The new version is installed. %{reason}"
    zh-CN: "新版本已装好，%{reason}"
