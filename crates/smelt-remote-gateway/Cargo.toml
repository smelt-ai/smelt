[package]
name = "smelt-remote-gateway"
version.workspace = true
edition.workspace = true
description = "Smelt mobile remote ACP and terminal gateway"

[lints]
workspace = true

[dependencies]
smelt-client = { path = "../smelt-client" }
smelt-paths = { path = "../smelt-paths" }
smelt-core = { path = "../smelt-core" }
smelt-runtime-client = { path = "../smelt-runtime-client" }
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "net", "sync", "time"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sha2 = "0.10"
