[package]
name = "smelt-core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# GUI（workspace）与守护（smeltd/gateway）共用的无 UI 逻辑：终端文本提取、OSC 通知
# 扫描、权限菜单解析、远程网关。这里绝不引 GPUI——守护侧的编译速度靠这条底线。

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
alacritty_terminal = { version = "0.26", default-features = false }
axum = { version = "0.8.9", features = ["ws"] }
# ACP 对话共享模型（acp_chat）里的逐行 diff 计算，GPUI 和 smelt 都用同一个算法。
similar = "2"
# ACP 连接层（acp_conn）：JSON-RPC over stdio 连子进程 agent，不含 GPUI，为
# smeltd 未来托管 ACP 会话铺路（见 acp_conn.rs 文件头）。
agent-client-protocol = { version = "=1.3.0", features = ["unstable_elicitation"] }
smol = "2"
chrono = { version = "0.4", features = ["serde"] }
# ACP 无缝升级续接（resume_acp_from_fds）要手搭 Lines 传输层（agent-client-
# protocol 的低层原语，见 acp_conn.rs 用法），直接用它的 Stream/Sink trait。
futures = "0.3"
async-process = "2"
libc = "0.2"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
