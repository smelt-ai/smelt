[package]
name = "smelt-core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# GUI（workspace）与守护（smeltd/gateway）共用的无 UI 逻辑：终端文本提取、OSC 通知
# 扫描、权限菜单解析。这里绝不引 GPUI，也不包含移动端远程网关。

[dependencies]
smelt-paths = { path = "../smelt-paths" }
smelt-store = { path = "../smelt-store" }
smelt-plugin-api = { path = "../smelt-plugin-api" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["json"] }
alacritty_terminal = { version = "0.26", default-features = false }
# ACP 对话共享模型（acp_chat）里的逐行 diff 计算，GPUI 和 smelt 都用同一个算法。
similar = "2"
# ACP 连接层（acp_conn）：JSON-RPC over stdio 连子进程 agent，不含 GPUI，为
# smeltd 未来托管 ACP 会话铺路（见 acp_conn.rs 文件头）。
agent-client-protocol = { version = "=2.1.0", features = ["unstable_plan_operations"] }
smol = "2"
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
# ACP 无缝升级续接（resume_acp_from_fds）要手搭 Lines 传输层（agent-client-
# protocol 的低层原语，见 acp_conn.rs 用法），直接用它的 Stream/Sink trait。
futures = "0.3"
async-process = "2"
libc = "0.2"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# 插件面板判断装上的桥版本是否落在本版 Smelt 验证过的范围里（SMELT_HOST_VERSION）。
semver = "1"
zstd = "0.13"

# Antigravity（agy）把本地历史存成 SQLite，读它需要原生 sqlite。与 smelt-store
# 同一条边界：移动端不编译，避免把 native SQLite 带进 iOS/Android FFI。
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
chrono-tz = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
