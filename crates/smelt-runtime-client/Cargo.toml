[package]
name = "smelt-runtime-client"
version.workspace = true
edition.workspace = true
description = "Smelt runtime (smeltd) wire protocol and client, shared by desktop and mobile"

[lints]
workspace = true

# 桌面和手机共用这一份协议客户端，必须能编进 iOS / Android：不许依赖 GPUI、
# smelt-store（原生 SQLite）或 smelt-core。CI 的 android-build 把它编进 APK，
# 依赖不对会在那里失败。
[dependencies]
smelt-paths = { path = "../smelt-paths" }
# 版本协商（compat）对照事件总线和核心投影的版本号。
smelt-event-protocol = { path = "../smelt-event-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# diff 行内词级高亮（protocol::git 的 mark_inline），跟 ACP 对话的逐行 diff 同一个算法库。
similar = "3"
# 文件查看器的图片等二进制内容在 JSON 里按 base64 传。
base64 = "0.23"
# 远程桌面的本机转发口：网页视图里的 noVNC 说 WebSocket；noVNC 和宿主页总是编进二进制
# （debug 也一样，手机上没有源码目录可读）。
tungstenite = "0.29"
rust-embed = { version = "8", features = ["debug-embed"] }

# Unix 上读不阻塞在内核的 recv 里，用 poll + MSG_DONTWAIT，见 stream/unix.rs。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows 上连守护走命名管道（smelt-sys 的 named_pipe），不用系统的 AF_UNIX，见 stream/windows.rs。
[target.'cfg(windows)'.dependencies]
smelt-sys = { path = "../smelt-sys" }
