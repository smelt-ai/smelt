# 远程桌面画布能力（纯原生 WebView + noVNC 本地转发口，不含插件视图/命令/工具栏 UI）。
[package]
name = "smelt-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../smelt-plugin-api" }
gpui = { package = "gpui-fast", version = "=0.1.19" }
wry = "0.57.3"
anyhow = "1"
log = "0.4"
serde_json = "1"
smol = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
