# 远程桌面画布能力（纯原生 WebView + noVNC 本地转发口，不含插件视图/命令/工具栏 UI）。
[package]
name = "smelt-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../smelt-plugin-api" }
gpui = { package = "gpui-fast", version = "=0.1.19" }
gpui-webview = { git = "https://github.com/longbridge/gpui-kit", rev = "82f1c1dc1f2970d93f1adfe10cbd772516c21ce7", features = ["gpui-fast"] }
wry = "0.57.3"
# 与 gpui-webview 共用同一套 gpui-fast 特性，单独编译本 crate 时不掉回 gpui-pre。
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "82f1c1dc1f2970d93f1adfe10cbd772516c21ce7", default-features = false, features = ["gpui-fast"] }
serde_json = "1"
smol = "2"
