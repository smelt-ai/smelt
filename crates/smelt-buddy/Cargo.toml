# 小人组件：会动的 3D 小人（零件、动作、合成、出帧节拍）。不认识会话，演哪一出由用它的一方给；
# JS 插件经 smelt-plugin-api 的 `SmeltBuddy` 用。
[package]
name = "smelt-buddy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
# 解小人的零件（编进来的 WebP）交给 gpui 画。版本跟 gpui 用的同一个，帧类型才对得上。
image = { version = "0.25", default-features = false, features = ["webp"] }
