# Realtime FPS, frame time, CPU, GPU and memory HUD for GPUI (`gpui-fast`).
# Adapted from `longbridge/gpui-kit` (`crates/fps`, Apache-2.0) to depend solely on `gpui-fast`
# without pulling in `gpui-pre`.
[package]
name = "smelt-fps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
gpui = { package = "gpui-fast", version = "=0.1.19", features = ["profiler"] }
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
sysinfo = "0.37"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
libc = "0.2"
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-io-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
] }

[target.'cfg(target_os = "linux")'.dependencies]
uuid = { version = "1", features = ["v5"] }
wayland-client = "0.31"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
gpui = { package = "gpui-fast", version = "=0.1.19", features = ["test-support"] }
