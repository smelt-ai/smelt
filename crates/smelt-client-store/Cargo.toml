[package]
name = "smelt-client-store"
version.workspace = true
edition.workspace = true
description = "Smelt desktop client's own SQLite store (appearance, layout, client preferences)"

[lints]
workspace = true

# 客户端自己的库：`~/.smelt/client.sqlite3`。只有 GUI 依赖它，运行时的表在 smelt-store；
# 两边分成两个 crate，「GUI 不碰运行时库」才能由依赖关系保证（设计文档 D5）。
[dependencies]
smelt-paths = { path = "../smelt-paths" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
