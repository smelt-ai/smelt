turn_hint.no_api_key:
  en: "No API key yet. In Settings → Agents → Custom Agents, create an agent based on this one, put your keys in Environment as KEY=value, one per line (e.g. OPENAI_API_KEY=sk-...), then start a new conversation with it."
  zh-CN: "还没配 API key：在「设置 → Agent → 自定义 Agent」新建一个基于这个 agent 的 Agent，在「环境变量」里按 KEY=值 每行一条填好（比如 OPENAI_API_KEY=sk-...），再用它新建对话。"
turn_hint.api_key_rejected:
  en: "The server rejected the API key. Check this agent's Environment in Settings → Agents → Custom Agents, and make sure no spaces or quotes were pasted along with it."
  zh-CN: "API key 被服务端拒绝了：到「设置 → Agent → 自定义 Agent」里这个 Agent 的「环境变量」核对一遍，注意别把前后空格或引号一起粘进去。"
turn_hint.connection_refused:
  en: "Couldn't reach the model service. If you set a custom base URL (such as OPENAI_BASE_URL), check the address and port in this agent's Environment under Settings → Agents → Custom Agents, and that this machine can reach it."
  zh-CN: "连不上模型服务：如果配了自定义 base URL（如 OPENAI_BASE_URL），到「设置 → Agent → 自定义 Agent」里这个 Agent 的「环境变量」确认地址和端口，以及本机能否访问。"
turn_hint.rate_limited:
  en: "The server is rate limiting requests. Wait a moment before sending again; if it keeps happening, check your account's quota."
  zh-CN: 被服务端限流了，等一会儿再发；持续出现就要看账号配额。
