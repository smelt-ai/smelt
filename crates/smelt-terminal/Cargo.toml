# 终端画布原子能力（不认识任何插件 id、不含设置页/存储/文案）：
# 连 smeltd 终端会话，用 alacritty_terminal 解析网格，GPUI 画布绘制（含 IME、搜索、kitty 图形、
# 断线自愈与输入恢复），提供主题配色快照与字号原子量。功能、设置页、右键菜单 id、快捷键与文案
# 全部在 JS 插件 `plugins/terminal/` 里完成。
[package]
name = "smelt-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smelt-plugin-api = { path = "../smelt-plugin-api" }
gpui = { package = "gpui-fast", version = "=0.1.17" }
# 终端网格的状态机；PTY 子进程在 smeltd 里。
alacritty_terminal = { version = "0.26", default-features = false }
# kitty 图形：守护转发来的 PNG 就地解码。
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
# 读线程叫醒 UI 时不带锁（redraw.rs）。
atomic-waker = "1.1"
dirs.workspace = true
serde_json = "1"
smol = "2"

[dev-dependencies]
gpui = { package = "gpui-fast", version = "=0.1.17", features = ["test-support"] }
# 连真实守护的用例拉起 smeltd 时把就绪管道的写端递给它（清 CLOEXEC）。
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
